<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>yacr CAD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Slint (winit backend) looks up this id and renders the shared shell. -->
  <main id="canvas-host"><canvas id="canvas"></canvas></main>

  <!-- Hidden pickers driven by the Rust host; never styled to be visible. -->
  <input type="file" id="file-input" accept=".dwg" hidden>
  <input type="file" id="annotation-input" accept=".json,application/json" hidden>

  <!-- Host chrome: `main.js` localizes the label from the shared catalog and
       persists the choice in localStorage. Language names stay in their own
       script (autonyms); they are not translated. -->
  <div id="host-controls">
    <button id="open-drawing" type="button" disabled>打开 DWG</button>
    <button id="retry-renderer" type="button" hidden>使用 WebGL2 重试</button>
    <label id="language-label" for="language">语言</label>
    <select id="language" aria-label="Language">
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <div id="host-state" role="status" aria-live="polite">正在加载 wasm…</div>
  <noscript>需要启用 JavaScript 才能运行 yacr CAD。</noscript>

  <!-- Dynamic import also catches a missing host module instead of staying stuck. -->
  <script type="module">
    import("./main.js").catch(error => {
      window.yacrStartupError = String(error);
      document.getElementById("host-state").textContent = "启动失败 / Startup failed: " + error;
      document.getElementById("retry-renderer").hidden = false;
    });
  </script>
</body>
</html>
