<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- Build stamp injected by scripts/build-web.sh (content hash of the wasm).
       main.js + pkg/yacr.js + pkg/yacr_bg.wasm are all requested under this
       stamp so a redeploy can never link a stale cached glue against a newer
       wasm (the "import object field ... is not a Function" LinkError). -->
  <meta name="yacr-build" content="__YACR_BUILD__">
  <title>yacr CAD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Accessibility boundary (audit U12): Slint draws into a single opaque
       <canvas>, which has no native HTML semantics and cannot be exposed as a
       per-entity ARIA model. #canvas-host is therefore declared as one labelled
       application region and is keyboard-focusable, while #a11y-status (below)
       is the explicit, non-visual alternative entry for status updates. This is
       not a claim that the canvas is equivalent to native semantics. -->
  <main id="canvas-host" role="application" aria-label="CAD canvas" tabindex="0">
    <canvas id="canvas"></canvas>
  </main>

  <!-- Hidden pickers driven by the Rust host; never styled to be visible. -->
  <input type="file" id="file-input" accept=".dwg,.dxf" hidden>

  <!-- Host chrome: `main.js` localizes the label from the shared catalog and
       persists the choice in localStorage. Language names stay in their own
       script (autonyms); they are not translated. -->
  <div id="host-controls">
    <button id="open-drawing" type="button" disabled></button>
    <button id="retry-renderer" type="button" hidden>使用 WebGL2 重试</button>
    <label id="language-label" for="language">语言</label>
    <select id="language" aria-label="Language">
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- Technical renderer line: loading/failure chrome only, hidden once the
       renderer is ready (see style.css). aria-live is OFF so it never competes
       with #a11y-status (the single announcement funnel, audit U12). -->
  <div id="host-state" role="status" aria-live="off">正在加载 wasm…</div>

  <!-- Accessible non-visual mirror of the Slint status/tool summary (audit U12).
       Visually hidden; updated by web/host/a11y.js through web/host/i18n.js on
       the same cadence as #host-state. -->
  <div id="a11y-status" class="visually-hidden" role="status"
       aria-live="polite" aria-atomic="true"></div>
  <noscript>需要启用 JavaScript 才能运行 yacr CAD。</noscript>

  <!-- Dynamic import also catches a missing host module instead of staying stuck.
       The live region is updated directly because the i18n funnel (main.js) is
       exactly what failed to load; the message is bilingual on purpose then. -->
  <script type="module">
    // Same build stamp as main.js so the host JS and the wasm/glue are always
    // fetched as one matched pair, never a stale-host/new-wasm mix.
    const build = (document.querySelector('meta[name="yacr-build"]') || {}).content || "dev";
    import(`./main.js?v=${build}`).catch(error => {
      window.yacrStartupError = String(error);
      const message = "启动失败 / Startup failed: " + error;
      document.getElementById("host-state").textContent = message;
      document.getElementById("a11y-status").textContent = message;
      document.getElementById("retry-renderer").hidden = false;
    });
  </script>
</body>
</html>
