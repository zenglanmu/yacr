<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The CSP must allow WebAssembly instantiation. Verified: with only
      `script-src 'self'`, both WebKitGTK 2.52.6 and Chromium 141 refuse the
      module ("'unsafe-eval' or 'wasm-unsafe-eval' is not an allowed source of
      script"). `connect-src` is what the wasm-bindgen `web` target needs to
      fetch `pkg/app_web_bg.wasm`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yacr — wasm CAD canvas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      The wasm CAD session presents its frame on this canvas (`start` resolves it
      by id). Build layout: the wasm-bindgen output must be served from `./pkg/`
      (see main.js). Serve this directory over HTTP; `file://` cannot instantiate
      wasm.
    -->
    <canvas id="cad-canvas"></canvas>
    <pre id="cad-status" role="status">starting...</pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
