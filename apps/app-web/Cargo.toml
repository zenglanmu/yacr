[package]
name = "app-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# **SPIKE ONLY** (ADR 0024 stage ⑧ phase 2): the `debug_session_*` exports that put
# the real `CadSession` on a page canvas. Off by default so a production wasm
# bundle does not carry a second session (+38.9 % measured: 9.66 MB -> 13.41 MB).
# Evidence builds: `cargo build -p app-web --target wasm32-unknown-unknown \
# --release --locked --features debug-session`.
debug-session = []

[dependencies]
# The **host-agnostic shell surface** (`src/shell.rs`): the frozen `cad_status`
# snapshot the shared React chrome (`apps/desktop-ui`) validates, plus the command
# vocabulary. `cad-ui-core` is a platform-free projection crate (no wgpu, no
# tauri, no GTK, no DOM), and `serde_json` is what serializes that snapshot, so
# both are dependencies of **every** target. That is what lets
# `cargo test -p app-web` assert the exact JSON wire shape on the host instead of
# only in a browser — the alternative (a wasm-only dependency) would leave the
# status untestable off-target. No `cad-*` crate gains a platform dependency from
# this: the arrow points app → cad, never back.
cad-ui-core.workspace = true
serde_json.workspace = true
# The camera arithmetic behind `open` and the `FIT` selector (`src/view.rs`) is
# **platform-free**: `cad-app::Camera`/`Projection`, `cad-db::DrawingDatabase` and
# `cad-domain` points build on every target, so the fit rule, the retained bounds
# and the zoom step are unit-tested on the host (`cargo test -p app-web`) instead of
# only observable in a browser. Nothing here gains a platform dependency: the
# arrow still points app → cad, never back.
cad-domain.workspace = true
cad-db.workspace = true
cad-app.workspace = true
# The `dom-canvas` wire transport (`src/direct.rs`) decodes `invoke` arguments
# into the typed values the desktop `#[tauri::command]` signatures produce, so it
# needs `serde`'s derive. `serde_json` is already a dependency (the shell status
# serializes on every target); neither adds a platform, toolkit or GPU edge.
serde.workspace = true

# The **browser platform contracts** of the shared desktop CAD session
# (`src/platform.rs`, ADR 0024 stage ⑧ phase 1). `cad-platform` is the host
# contract crate (no windowing/GPU type in it) and `cad-host` provides the
# `HostPlatform`/`HostResources` composition plus the delivery funnel the bytes
# entry reuses; `cad-engine` is named only for the `RenderSessionHandle` the
# session is built with (a handle with **no device**: the GPU lane attaches one
# later, exactly as on the desktop). None of them gains a platform dependency from
# this — the arrow still points app → cad, never back — and all three compile for
# `wasm32-unknown-unknown`, which is what makes the session constructible in the
# browser at all.
cad-platform.workspace = true
cad-host.workspace = true
cad-engine.workspace = true

# The browser host is the wasm CAD session of the `dom-canvas` runtime
# (`surfaceMode: dom-canvas`, ADR 0024): it imports caller-supplied DWG bytes (or
# the compiled-in synthetic fixture for `start`), builds the display scene,
# renders it with the renderer's offscreen frame and presents that frame on a DOM
# `<canvas>` through the wasm-only WebGL2 presenter.
#
# Everything below is **wasm-only**: no native target can present on a DOM
# canvas, so `src/lib.rs` keeps an explicit NOT IMPLEMENTED entry point there
# instead of a second, silently different code path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen must match the wasm-bindgen-cli used to post-process the module.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  # The isolated carrier (ADR 0024 stage ⑧): the Worker receives an
  # `OffscreenCanvas` the page transferred with `transferControlToOffscreen()`, and
  # `worker_capability()` probes a 1x1 `OffscreenCanvas` for a WebGL2 context.
  "OffscreenCanvas",
  "console",
] }
# The CAD session itself: import → scene → renderer. `cad-render-wgpu` stays the
# only wgpu owner; this crate hands it a `Device`/`Queue` it got from the canvas
# presenter and never constructs a wgpu object of its own.
cad-import-acadrust.workspace = true
# `cad-scene::SceneDelta` is the geometry/GPU boundary: `load` produces it, the
# renderer uploads it. Naming it is what lets a failed open leave the live
# session untouched.
cad-scene.workspace = true
cad-render-wgpu.workspace = true
# `serde_json` moved to `[dependencies]`: it now serializes the shell status on
# every target (see above), not only the wasm session status.
# `std::time::Instant::now()` panics on wasm32-unknown-unknown ("time not
# implemented"); `web-time` uses `Performance.now()` in the browser and re-exports
# std natively. Used only for the honest import measurement.
web-time.workspace = true
