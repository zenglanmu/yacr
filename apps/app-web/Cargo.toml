[package]
name = "app-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The web UI is retired (explicit NOT IMPLEMENTED placeholder): the wasm entry
# points only reject with a diagnostic, so the old cad-* / Slint host
# dependencies are gone. Only the wasm bindings the entry points need remain.
[dependencies]

# Browser host stack. wasm-bindgen must match the wasm-bindgen-cli used to
# post-process the module; Slint already pins these versions in Cargo.lock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console"] }