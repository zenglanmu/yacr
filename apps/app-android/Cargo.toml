[package]
name = "app-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cad-ui-slint.workspace = true
cad-app.workspace = true
cad-platform.workspace = true
cad-import-acadrust.workspace = true
cad-db.workspace = true
cad-domain.workspace = true
# The layout panel's `active` space is a `cad_representation::SpaceSelection`;
# the host must name that type when pushing `LayoutPanelState`.
cad-representation.workspace = true
log.workspace = true

# The android-activity stack is Android-only; keeping it target-scoped lets the
# rest of the workspace compile for wasm/host targets.
[target.'cfg(target_os = "android")'.dependencies]
slint.workspace = true
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
ndk-sys = "0.6"
android_logger = "0.14"

[package.metadata.android]
package = "dev.yacr.app"
apk_name = "yacr"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
min_sdk_version = 26
target_sdk_version = 34
# Bundle the optional font package under `assets/fonts/`. The host reads it via
# the activity AssetManager (`android_fonts::ASSET_BASE = "asset://fonts/"`).
# Fonts are third-party (mlightcad/cad-data) and included for on-device testing;
# see docs/fonts.md for provenance and licensing.
assets = "assets"

# Development-only release signing. The keystore is gitignored (*.jks) and must
# be generated locally (see docs/build.md). Production keys never enter the repo.
[package.metadata.android.signing.release]
path = "dev-release.jks"
keystore_password = "yacrdev"
key_alias = "yacr"
key_password = "yacrdev"
