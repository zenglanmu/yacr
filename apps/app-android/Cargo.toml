[package]
name = "app-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# The Android UI is retired (explicit NOT IMPLEMENTED placeholder): the native
# entry point only reports the retirement and aborts, so the old
# Slint/cad-host/cad-engine composition-root dependencies are gone. `log` is the
# facade the entry point logs through.
[dependencies]
log.workspace = true

# The Android native-activity stack is Android-only; keeping it target-scoped
# lets the rest of the workspace compile the crate's host target.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"

[package.metadata.android]
package = "dev.yacr.app"
apk_name = "yacr"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
# Effective SDK levels. NOTE: cargo-apk 0.10 does not honour these top-level
# keys (it serialises `<uses-sdk>` from a nested `[package.metadata.android.sdk]`
# table), so the shipped manifest is minSdk 23 / targetSdk 30. These are kept at
# the real values so they match the artifact and `scripts/build-android.sh`'s
# `d8 --min-api` (23); see docs/build.md and docs/ci.md.
min_sdk_version = 23
target_sdk_version = 30
# Retained packaging artifacts from the retired UI. The optional font package
# under `assets/fonts/` and the launcher `res/` are no longer read by any Rust
# code (the APK asset loader was retired with the UI); they are kept because the
# out-of-scope packaging scripts and CI still reference them. Fonts are
# third-party (mlightcad/cad-data); see docs/fonts.md for provenance.
assets = "assets"

# Launcher icon resources. `res/` holds the PNG mipmaps plus the API 26+
# adaptive-icon definition generated from `assets/yacr-icon.svg` by
# `scripts/generate-icons.py`; cargo-apk compiles the folder and the manifest
# reads the icon/label from `[package.metadata.android.application]`.
resources = "res"

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "yacr"
# The app ships a small Java shim (SAF mediation); the system must load
# classes.dex, so `android:hasCode` must be true. cargo-apk injects the dex
# during the `scripts/build-android.sh` post-processing step.
has_code = true

# Retained packaging metadata from the retired UI. The declared launcher activity
# is still a NativeActivity subclass (see
# `android/dev/yacr/app/YacrNativeActivity.java`); the native entry point it
# reaches (`android_main`) now reports the retirement and aborts. The Java shim
# and this activity declaration are dead wiring kept only because the
# out-of-scope `scripts/build-android.sh` post-processing still references them.
[package.metadata.android.application.activity]
name = "dev.yacr.app.YacrNativeActivity"

# Development-only release signing. The keystore is gitignored (*.jks) and must
# be generated locally (see docs/build.md). Production keys never enter the repo.
[package.metadata.android.signing.release]
path = "dev-release.jks"
keystore_password = "yacrdev"
key_alias = "yacr"
key_password = "yacrdev"
