[package]
name = "app-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cad-host.workspace = true
cad-ui-slint.workspace = true
cad-app.workspace = true
cad-platform.workspace = true
cad-import-acadrust.workspace = true
cad-db.workspace = true
cad-domain.workspace = true
# The layout panel's `active` space is a `cad_representation::SpaceSelection`;
# the host must name that type when pushing `LayoutPanelState`.
cad-representation.workspace = true
log.workspace = true

# The android-activity stack is Android-only; keeping it target-scoped lets the
# rest of the workspace compile for wasm/host targets.
[target.'cfg(target_os = "android")'.dependencies]
slint.workspace = true
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
ndk-sys = "0.6"
android_logger = "0.14"

[package.metadata.android]
package = "dev.yacr.app"
apk_name = "yacr"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
# Effective SDK levels. NOTE: cargo-apk 0.10 does not honour these top-level
# keys (it serialises `<uses-sdk>` from a nested `[package.metadata.android.sdk]`
# table), so the shipped manifest is minSdk 23 / targetSdk 30. These are kept at
# the real values so they match the artifact and `scripts/build-android.sh`'s
# `d8 --min-api` (23); see docs/build.md and docs/ci.md.
min_sdk_version = 23
target_sdk_version = 30
# Bundle the optional font package under `assets/fonts/`. The host reads it via
# the activity AssetManager (`android_fonts::ASSET_BASE = "asset://fonts/"`).
# Fonts are third-party (mlightcad/cad-data) and included for on-device testing;
# see docs/fonts.md for provenance and licensing.
assets = "assets"

# Launcher icon resources. `res/` holds the PNG mipmaps plus the API 26+
# adaptive-icon definition generated from `assets/yacr-icon.svg` by
# `scripts/generate-icons.py`; cargo-apk compiles the folder and the manifest
# reads the icon/label from `[package.metadata.android.application]`.
resources = "res"

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "yacr"
# The app ships a small Java shim (SAF mediation); the system must load
# classes.dex, so `android:hasCode` must be true. cargo-apk injects the dex
# during the `scripts/build-android.sh` post-processing step.
has_code = true

# The declared launcher activity is a NativeActivity subclass (see
# `android/dev/yacr/app/YacrNativeActivity.java`) that mediates the SAF picker.
# Subclassing keeps the exact native lifecycle android-activity/Slint depend on
# while giving us `onActivityResult`, and — unlike a second `<activity>` entry —
# needs no fragile edit of the compiled binary AndroidManifest.xml.
[package.metadata.android.application.activity]
name = "dev.yacr.app.YacrNativeActivity"

# Development-only release signing. The keystore is gitignored (*.jks) and must
# be generated locally (see docs/build.md). Production keys never enter the repo.
[package.metadata.android.signing.release]
path = "dev-release.jks"
keystore_password = "yacrdev"
key_alias = "yacr"
key_password = "yacrdev"
