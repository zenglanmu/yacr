[package]
name = "app-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cad-app.workspace = true
cad-domain.workspace = true
cad-platform.workspace = true

# The Android composition root only links the shared Slint shell for the Android
# target. Keeping it target-specific lets `cargo test -p app-android` build the
# host-testable command router without the host GUI backend (fontconfig/Skia).
[target.'cfg(target_os = "android")'.dependencies]
cad-ui-slint.workspace = true
slint.workspace = true

[package.metadata.android]
package = "dev.yacr.app"
apk_name = "yacr"
# Only the ABI whose Skia/wgpu prebuilt and APK packaging was actually verified
# (see docs/adr/0002-android-host-and-apk.md). Other ABIs are candidates, not
# verified targets.
build_targets = ["aarch64-linux-android"]
min_sdk_version = 26
target_sdk_version = 34
