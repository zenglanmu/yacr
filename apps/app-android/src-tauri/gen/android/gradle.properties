# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Disabled on purpose (2026-11-09): the CI `android-release` APK build failed
# intermittently inside the incubated configuration cache —
# ":app:compileUniversalReleaseKotlin ... error writing value of type
#  DefaultNamedDomainObjectCollection$ExistingNamedDomainObjectProvider"
# ("Configuration cache entry discarded due to serialization error") with
# Gradle 9.6.1 + Kotlin Gradle Plugin 2.2.10 — which aborted the build before
# signing. A plain rerun passed, so this is a flake; release packaging must not
# depend on it. `scripts/test-android-host.py` pins this line. Re-enable only
# after KGP/Gradle fix the serialization, with a green release run as evidence.
org.gradle.configuration-cache=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false
