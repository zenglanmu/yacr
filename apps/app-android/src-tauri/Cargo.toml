[package]
name = "app-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Tauri 2 **Android host**: a WebView carrier for the shared React chrome
# (apps/desktop-ui, built with `YACR_RUNTIME=android`) plus, on the
# `native-below` carrier (P5), the native CAD session: `cad-db` is owned by the
# native Rust `CadSession` and wgpu presents to the `SurfaceView` layered beneath
# the WebView. The wasm session does not run; the chrome is unchanged.
#
# The crate is a library only: the Android glue is generated by `tauri android
# init` (`src-tauri/gen/android`, committed) and calls [`app_android::run`]
# through the `#[tauri::mobile_entry_point]` shim.
#
# `staticlib` is what the Android Gradle project links (`libapp_android.so`);
# `cdylib`/`rlib` keep the normal host/`cargo check` story working. There is no
# binary: an Android host has no `main`.
[lib]
name = "app_android"
crate-type = ["staticlib", "cdylib", "rlib"]

# Production builds set `custom-protocol` (the CLI does it for a release
# `tauri android build`); without it Tauri would look for a dev server. The
# feature list must stay declared here — the CLI checks for it.
[features]
custom-protocol = ["tauri/custom-protocol"]

# Android-only dependencies. Scoping them by target os is what lets the rest of
# the workspace keep compiling this member for the host and for
# `wasm32-unknown-unknown` (the `--lib` wasm gate): on those targets the crate is
# a documented empty shell (see `src/lib.rs`), not a Tauri app.
[target.'cfg(target_os = "android")'.dependencies]
tauri.workspace = true
# `android_logger` is how a host line actually reaches `logcat`
# (`adb logcat -s yacr`); the `log` facade it installs is a non-wasm dependency
# (see below), so the target-independent `platform` module logs through it too.
android_logger = "0.14"

# The native `native-below` carrier (P5): the shared command/state layer (the one
# place Tauri commands live), the owner-thread session (`cad-host`/`cad-ui-core`)
# and the renderer surface (`cad-render-wgpu` + `cad-engine`'s render handle).
# None of these is a second document authority: exactly one `CadSession` is
# created, on the Tauri loop thread (the thread `tao`'s Android entry point spawns
# for the event loop — see `src/surface.rs` for the UI-thread hand-off).
cad-desktop-shell.workspace = true
cad-host.workspace = true
cad-render-wgpu.workspace = true
cad-engine.workspace = true
# Raw `AndroidNdkWindowHandle`/`AndroidDisplayHandle` for the renderer surface
# (the presenter is built from the `SurfaceView`'s `ANativeWindow`, not from a
# Tauri window type). Same 0.6.2 the renderer already uses via wgpu.
raw-window-handle.workspace = true

# The frozen Kotlin -> Rust JNI contract (`MainActivity.native*`). Both are
# already in `Cargo.lock` as transitive dependencies (jni 0.21.1 via Tauri,
# ndk 0.9.0 via tao); the versions are pinned to those so no second JNI/NDK
# binding set enters the graph. `nativewindow` is what turns an
# `android.view.Surface` into the `ANativeWindow` wgpu presents to.
jni = "0.21.1"
ndk = { version = "0.9.0", features = ["nativewindow"] }

# Target-independent contracts, compiled wherever the `platform` module is (the
# dev host included) so the explicit-refusal unit tests actually run without a
# device. `log` is a facade only (records are no-ops without a logger installed).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cad-domain.workspace = true
cad-platform.workspace = true
# The popup seam is toolkit-neutral: `popup.rs` only implements the shared
# `PopupOps` contract (the `textEdit` payload + its shared refusal) and is
# compiled on the dev host so that refusal is a real behavioural test. Android
# targets are covered by this same `not(wasm32)` table.
cad-ui-core.workspace = true
log.workspace = true

# `tauri-build` generates the Tauri context (and the `TAURI_ANDROID_PACKAGE_NAME_*`
# env vars `#[tauri::mobile_entry_point]` expands with) for an Android target. It
# is an ordinary build-dependency (compiled for the host) and `build.rs` gates the
# call on the *target* os.
[build-dependencies]
tauri-build.workspace = true
