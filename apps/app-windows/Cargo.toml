[package]
name = "app-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Deliberately distinct from the Linux product binary (`app-linux` → `yacr`):
# both packages compile for the same host target during workspace checks, so a
# shared `yacr` name would produce the same output artifact path and let the two
# hosts compete for (or overwrite) one executable.
name = "yacr-windows"
path = "src/main.rs"

# Native Windows desktop host for the CAD viewer/measure/annotation app: a
# transparent WebView2 (React chrome) **above** an in-process native CAD child
# HWND. The DOM is the single input funnel (`.native-input` → `probe_input`);
# the CAD surface is display-only and never receives OS input. The shared
# platform-independent logic lives in `cad-ui-core`, the Tauri command/state
# layer in `cad-desktop-shell`, and the renderer surface is created from raw
# `Win32WindowHandle` handles with **no renderer changes**.
#
# **Windows only**. `tauri`/`wry`/`tao`, WebView2 and the Win32 APIs are
# Windows-target dependencies; a workspace wasm (or other-target) `--lib` check
# compiles an empty host instead. The binary returns an explicit NOT IMPLEMENTED
# error elsewhere (`src/entry.rs`).
[target.'cfg(target_os = "windows")'.dependencies]
tauri.workspace = true
cad-render-wgpu.workspace = true
# Raw `Win32WindowHandle`/`WindowsDisplayHandle` for the renderer surface (the
# presenter is built from the CAD child HWND, not from a Tauri window type).
raw-window-handle.workspace = true

cad-desktop-shell.workspace = true
cad-app.workspace = true
cad-engine.workspace = true
cad-resources.workspace = true
# ADR-0061 P-MESH-1a/1b: the mesh kernel is carrier-owned composition, exactly
# like the renderer and the `.ymodel` archive. Only an `apps/app-*` host links
# it (`scripts/check-architecture.py`); the shared layers see only the
# `MeshModeler` trait. Without the injection every mesh boolean/repair refuses
# with `unsupported-runtime: mesh-modeler` instead of silently approximating.
cad-kernel-manifold.workspace = true

# Hand-rolled Win32 child window (class, z-order, sizing) + WebView2 runtime
# detection (registry queries). Version-matched to the `windows`/`webview2-com`
# that `tauri 2.12.5`/`wry 0.57.0` put in `Cargo.lock` (windows 0.62 /
# webview2-com 0.39), so this adds no duplicate COM bindings. The tauri bump
# forced this retarget (0.61/0.38); the code needed no changes.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # DirectComposition: the CAD child is composited through
    # CreateSwapChainForComposition + IDCompositionVisual, not a HWND swapchain.
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # Release builds are GUI-subsystem binaries; `main.rs` re-attaches to the
    # parent terminal's console so `[probe]` evidence still reaches a terminal.
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    # `CreateFileW("CONOUT$")` needs the SECURITY_ATTRIBUTES type in its
    # signature even though this call passes none.
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

# Target-independent carrier contracts. `support` (the WebView2 "missing
# runtime" contract and the transparent-background constants), the file/platform
# seam in `platform.rs` (`ReactFiles`/`ReactSurface`/`ReactConfigStore`, including
# the atomic save write), the `.ymodel` archive adapter and the recovery store
# are plain std-fs/trait code, so their contract tests run on any host. Only the
# native COM choosers are Windows-gated (`platform/native.rs`).
#
# `cad-store-zip` is the carrier-owned container: `scripts/check-architecture.py`
# forbids it in every shared `cad-*` layer, so it may only be linked here, through
# `cad_platform::DocumentArchive`.
[dependencies]
cad-ui-core.workspace = true
cad-platform.workspace = true
cad-domain.workspace = true
cad-db.workspace = true
cad-host.workspace = true
cad-store-zip.workspace = true
# Durable preference read (`wgpu_backend`) through the same JSON store the
# shared UI writes, and the recovery record's strict lexical layer; no new
# dependency version (workspace pin).
serde_json.workspace = true

# `tauri-build` generates the Tauri context and embeds the Windows icon/version
# resource for a Windows target. It is an ordinary build-dependency (compiled for
# the host) because build scripts are host binaries; `build.rs` additionally
# checks the *target* os at runtime before invoking it, so non-Windows targets
# compile an empty host.
[build-dependencies]
tauri-build.workspace = true
