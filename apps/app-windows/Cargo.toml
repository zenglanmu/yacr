[package]
name = "app-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Deliberately distinct from the Linux product binary (`app-linux` → `yacr`):
# both packages compile for the same host target during workspace checks, so a
# shared `yacr` name would produce the same output artifact path and let the
# unavailable Windows stub compete with (or overwrite) the real Linux executable.
# `yacr-windows` is the honest name for this NOT IMPLEMENTED stub.
name = "yacr-windows"
path = "src/main.rs"

# The Windows host is NOT IMPLEMENTED in this round (see src/main.rs); the
# binary is an explicit failure stub with no runtime dependencies. The former
# `app-linux` (shared Slint host) dependency is gone — that host is retired.

# The build script embeds the shared app icon (`assets/yacr-icon.ico`) into the
# PE resource section. `winresource` compiles on every host but is only invoked
# for Windows targets (see build.rs), driving rc.exe (MSVC) or windres (GNU).
[build-dependencies]
winresource = "0.1"
