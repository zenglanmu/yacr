[package]
name = "app-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yacr"
path = "src/main.rs"

# The Windows GUI binary is a thin wrapper over the shared desktop host in
# `app-linux`; all controller/Slint/host logic lives there.
[target.'cfg(windows)'.dependencies]
app-linux = { path = "../app-linux" }
