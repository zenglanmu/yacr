[package]
name = "app-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yacr"
path = "src/main.rs"

# The Windows GUI binary is a thin wrapper over the shared desktop host in
# `app-linux`; all controller/Slint/host logic lives there.
[target.'cfg(windows)'.dependencies]
app-linux = { path = "../app-linux" }

# The build script embeds the shared app icon (`assets/yacr-icon.ico`) into the
# PE resource section. `winresource` compiles on every host but is only invoked
# for Windows targets (see build.rs), driving rc.exe (MSVC) or windres (GNU).
[build-dependencies]
winresource = "0.1"
