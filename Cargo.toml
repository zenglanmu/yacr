[workspace]
resolver = "2"
members = [
    "crates/cad-domain",
    "crates/cad-db",
    "crates/cad-dependencies",
    "crates/cad-history",
    "crates/cad-geometry",
    "crates/cad-kernel-adapter",
    "crates/cad-representation",
    "crates/cad-spatial",
    "crates/cad-scene",
    "crates/cad-render-wgpu",
    "crates/cad-measure",
    "crates/cad-proxy",
    "crates/cad-import-core",
    "crates/cad-import-acadrust",
    "crates/cad-import-obj",
    "crates/cad-import-stl",
    "crates/cad-import-mesh",
    "crates/cad-import-step",
    "crates/cad-import-ifc",
    "crates/cad-import-rvt",
    "crates/cad-import-skp",
    "crates/cad-resources",
    "crates/cad-query",
    "crates/cad-app",
    "crates/cad-engine",
    "crates/cad-host",
    "crates/cad-ui-core",
    "crates/cad-desktop-shell",
    "crates/cad-platform",
    "crates/cad-diagnostics",
    "crates/cad-cli-tools",
    "apps/app-android/src-tauri",
    "apps/app-web",
    "apps/app-linux",
    "apps/app-windows",
    "apps/app-macos",
]

[workspace.package]
version = "0.1.12"
edition = "2021"
# True MSRV floor, not a preference: `cadmpeg-ir`/`cadmpeg-codec-step`/
# `cadmpeg-tessellate` 0.6.11 declare `rust-version = "1.88"` and `rvt` 0.17.0
# declares `1.87`, so no lower workspace claim can be honest. Every crate takes
# this single value via `rust-version.workspace = true`; do not re-declare it per
# crate. The pinned toolchain (`rust-toolchain.toml`, 1.99.1) is unrelated.
rust-version = "1.88"
# Must match `LICENSE` (AGPL-3.0). The previous `Apache-2.0 OR MIT` here was a
# stale field contradicting the repository licence; every crate inherits this
# value via `license.workspace = true`. AGPL-3.0 may combine with GPL-3.0 code
# (AGPLv3 §13), which is what permits GPL-3.0-only dependencies such as
# `skpwright`.
license = "AGPL-3.0-only"
authors = ["yacr contributors"]
repository = "https://example.invalid/yacr"

[workspace.dependencies]
cad-domain = { path = "crates/cad-domain" }
cad-db = { path = "crates/cad-db" }
cad-dependencies = { path = "crates/cad-dependencies" }
cad-history = { path = "crates/cad-history" }
cad-geometry = { path = "crates/cad-geometry" }
cad-kernel-adapter = { path = "crates/cad-kernel-adapter" }
cad-representation = { path = "crates/cad-representation" }
cad-spatial = { path = "crates/cad-spatial" }
cad-scene = { path = "crates/cad-scene" }
cad-render-wgpu = { path = "crates/cad-render-wgpu" }
cad-measure = { path = "crates/cad-measure" }
cad-proxy = { path = "crates/cad-proxy" }
cad-import-core = { path = "crates/cad-import-core" }
cad-import-acadrust = { path = "crates/cad-import-acadrust" }
cad-import-obj = { path = "crates/cad-import-obj" }
cad-import-stl = { path = "crates/cad-import-stl" }
cad-import-mesh = { path = "crates/cad-import-mesh" }
cad-import-step = { path = "crates/cad-import-step" }
cad-import-ifc = { path = "crates/cad-import-ifc" }
cad-import-rvt = { path = "crates/cad-import-rvt" }
cad-import-skp = { path = "crates/cad-import-skp" }
cad-resources = { path = "crates/cad-resources" }
cad-query = { path = "crates/cad-query" }
cad-app = { path = "crates/cad-app" }
cad-engine = { path = "crates/cad-engine" }
cad-host = { path = "crates/cad-host" }
cad-ui-core = { path = "crates/cad-ui-core" }
cad-desktop-shell = { path = "crates/cad-desktop-shell" }
cad-platform = { path = "crates/cad-platform" }
cad-diagnostics = { path = "crates/cad-diagnostics" }

# Integration candidates only: not linked or validated by the scaffold.
acadrust = { version = "0.6.8", features = ["serde", "import"] }
wgpu = "=30.0.1"
glam = { version = "0.33", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
getrandom = { version = "0.3", features = ["wasm_js"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ttf-parser = "0.25"
flate2 = "1"
encoding_rs = "0.8"
# Headless (native) software-Vulkan render path: blocking on wgpu's async
# adapter/device requests, and encoding the offscreen frame to PNG.
png = "0.18"
# Decoding raster images referenced by a drawing (`cad-resources`). Pure-Rust
# and wasm-safe; zune-core is already in the lock via the image/wgpu stack.
zune-jpeg = "0.5"
futures-lite = "2.6"

# Per-chunk local R-tree for the two-level pick broad phase (ADR-0012 §7:
# "每 chunk 内以 rstar 作 local 索引，bulk_load 重建式 + 不可变快照"). Consumed
# only by `cad-spatial`; `cad-scene`/`cad-app`/`cad-measure` go through it.
# `default-features = false`: rstar's default feature set is empty, stated
# explicitly so a future default cannot silently widen the dependency.
rstar = { version = "0.13.0", default-features = false }

# Wavefront OBJ reader (`cad-import-obj`). `default-features = false` is
# mandatory: the default `ahash` feature pulls `getrandom 0.3`, which does not
# compile for `wasm32-unknown-unknown`. The loader falls back to `std`'s hasher.
tobj = { version = "4.0.5", default-features = false }

# STereoLithography reader (`cad-import-stl`): ASCII and binary, pure Rust.
stl_io = "0.11"

# ISO 10303-21 (STEP) reader + B-rep tessellation (`cad-import-step`).
# `cadmpeg-ir` is a mandatory direct dependency: the `Codec` trait and
# `DecodeOptions` live there, not in the codec crate. The codec canonicalises
# every length to millimetres and exposes no source-unit field; the adapter
# records that in its units diagnostic. `cadmpeg-core` is deliberately not a
# dependency: `DecodeDepth` is only needed by the non-default depth path.
cadmpeg-codec-step = "0.6.11"
cadmpeg-ir = "0.6.11"
cadmpeg-tessellate = "0.6.11"

# IFC (IFC2X3/IFC4/IFC4X3) reader + mesh generation (`cad-import-ifc`).
# MPL-2.0, upstream <https://github.com/LTplus-AG/ifc-lite>. **Pinned exactly**:
# the crate has published 100+ releases since 2026-01, so a caret range would
# float across breaking API churn. The geometry crate also carries the placement
# chain, units-to-metres scaling and void subtraction; see the crate source
# findings recorded in `crates/cad-import-ifc/src/lib.rs`.
ifc-lite-core = "=28.2.0"
ifc-lite-geometry = "=28.2.0"

# Autodesk Revit reader (`cad-import-rvt`). Apache-2.0, pure Rust, pinned
# exactly: the crate published 19 releases in six weeks. It is a **preview**
# reader: element bodies are bounding boxes on Revit 2008-2023, 2024/2025 are
# `partial`, 2026/2027 `experimental`, and family files carry no geometry.
# Its MSRV is 1.87, below the workspace floor of 1.88 which `cadmpeg-*` sets;
# `cad-import-rvt` therefore takes `rust-version` from the workspace rather than
# re-declaring a value. The pinned toolchain is 1.99.
# glTF is only its internal hand-off format (the crate has no gltf dependency);
# `gltf` reads that single-buffer GLB. `default-features = false` drops the
# `image` importer, which this lane never needs, and keeps `utils`/`names`.
rvt = "=0.17.0"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }

# SketchUp `.skp` reader (`cad-import-skp`). **GPL-3.0-only**, pure Rust with a
# single `miniz_oxide` dependency (sha-free, wasm-safe). The workspace licence is
# AGPL-3.0, which may combine with GPL-3.0 code (AGPLv3 §13); the GPL part stays
# GPLv3 for downstream consumers — see `THIRD_PARTY_NOTICES.md`.
# Pinned exactly: pre-1.0, one maintainer, first release 2026-07, and the
# 2021-2025 release range is inferred from container equivalence (no observed
# sample), so a caret range must not float across a format-claim change.
# It is a **preview** reader: triangles only (no edge geometry), no UV/texture
# sampling, no measurement semantics.
skpwright = "=0.6.0"

# Portable wall clock. `std::time::Instant::now()` panics on
# wasm32-unknown-unknown ("time not implemented"); `web-time` re-exports std on
# native and uses `Performance.now()` in the browser. Already in the lock via
# winit / acadrust.
web-time = "1"

# Browser host (wasm32 only). Pinned to the versions already in Cargo.lock via
# the wgpu web stack; wasm-bindgen-cli must match `wasm-bindgen` exactly.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"

# React + Tauri native Linux desktop host (`apps/app-linux`). Tauri2 and its
# build helper are the runtime/build dependencies; the host reuses the existing
# `cad-render-wgpu::SurfaceProbePresenter` with no renderer changes.
# `tauri-build` is versioned independently of `tauri` (2.7.x vs 2.12.x).
# `2.12.3` is the documented floor for `WindowBuilder::no_redirection_bitmap`
# (the creation-time `WS_EX_NOREDIRECTIONBITMAP`; the API exists since 2.12.0,
# verified in the registry sources). Its runtime family moves with it (resolved
# from the lock): tauri-runtime 2.12.2, tauri-runtime-wry 2.12.3,
# tauri-macros/codegen 2.7.4, tauri-utils 2.10.2, tao 0.37.1, wry 0.57.0,
# webview2-com 0.39.1 (single version; the app-windows pins were retargeted with
# it so no duplicate COM bindings remain).
tauri = { version = "=2.12.3", features = ["unstable"] }
tauri-build = { version = "=2.7.2" }
# GTK overlay bridge for the Linux host. Versions match the gtk/gdk/gdkx11
# already in the lock via Tauri.
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
# GDK Wayland accessors (`gdk_wayland_display_get_wl_display` /
# `gdk_wayland_window_get_wl_surface`) for the app-owned child wl_surface bridge.
# Same version family as gtk/gdk/gdkx11 (already in the lock via tao).
gdkwayland-sys = "0.18"
# Compile the private Wayland protocol shim (cc) and probe wayland-client.pc
# (pkg-config) in `apps/app-linux/build.rs`.
cc = "1"
pkg-config = "0.3"
# Needed to read the X11 top-level XID of the Tauri window (tauri does not
# re-export raw-window-handle). Matches the 0.6.2 already in the lock via wgpu.
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The `dom-canvas` wasm session (`app-web`) is published to Cloudflare Pages by
# `web-deploy`, and Pages rejects any single uploaded file over 25 MiB. A plain
# `release` build is ~37 MB since the STEP/IFC importers landed, so the browser
# build uses its own size profile: `opt-level = "s"` + `panic = "abort"` +
# fat LTO puts the pre-`wasm-opt` module where `wasm-opt -Oz`
# (`scripts/lib/wasm-toolchain.sh`) can bring it under the limit. Native hosts
# keep `profile.release`; only `scripts/*build*wasm*` and `scripts/build-web*.sh`
# select this profile.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

# Dependencies carry line tables only; the workspace's own crates keep full
# debuginfo. A fully instrumented `cadmpeg-ir` rlib is ~0.93 GB, and Cargo keeps
# one artefact per feature unification (per-package `-p` builds each resolve a
# different subset), so dependency debuginfo is what pushed `target/` into the
# tens of GB. Line tables keep dependency frames named in backtraces and usable
# for line-level breakpoints; only stepping into dependency internals loses
# variable/type information.
[profile.dev.package."*"]
debug = 1
