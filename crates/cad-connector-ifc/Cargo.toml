[package]
name = "cad-connector-ifc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "IFC (IFC2X3/IFC4/IFC4X3) connector: parse and mesh into the neutral mesh contract, and write IFC4 IfcTriangulatedFaceSet."

[dependencies]
# RGBA8 IFC textures are encoded to PNG before they enter the document store.
png.workspace = true
cad-domain.workspace = true
cad-db.workspace = true
cad-connector-core.workspace = true
# MPL-2.0, pinned exactly in the workspace. `ifc-lite-geometry` owns the
# placement chain, the file-unit → metre scaling and the void subtraction; this
# adapter only walks products and converts the resulting f32 mesh.
ifc-lite-core.workspace = true
ifc-lite-geometry.workspace = true
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; `web-time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true
# The writer half (`src/export/`) executes an `ifc-lite-export` plan.
ifc-lite-export.workspace = true
# Pinned so `ifc-lite-export`'s caret dependency cannot float this member of
# the 28.3.0 family past the reader's `=28.3.0` pins.
ifc-lite-processing.workspace = true

[dev-dependencies]
# Proves IFC bytes never reach the STEP adapter (which refuses them by name).
cad-connector-step.workspace = true
