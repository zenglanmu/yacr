[package]
name = "cad-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Session/Workspace, commands, capability and tool state."

# Format lanes are feature-gated so a carrier that links only the DWG/DXF
# exchange (the `dom-canvas` wasm bundle) does not pull every adapter into its
# artifact. `cad-connector-acadrust` stays mandatory: it is the DWG/DXF base and
# `lib.rs` re-exports `cad_acadrust::…` unconditionally. The feature names below
# are a contract — a carrier that disables defaults relies on them.
[features]
default = ["formats-all"]
# Native carriers rely on this default; the web wasm bundle is slim only because
# every `cad-app` edge in `app-web`'s graph disables defaults.
formats-all = [
  "formats-mesh",
  "formats-ifc",
  "formats-step",
  "formats-dgn",
  "formats-rvt",
  "formats-skp",
  "formats-gltf",
]
formats-mesh = ["dep:cad-connector-mesh"]
formats-ifc = ["dep:cad-connector-ifc"]
formats-step = ["dep:cad-connector-step"]
formats-dgn = ["dep:cad-connector-dgn"]
formats-rvt = ["dep:cad-connector-rvt"]
formats-skp = ["dep:cad-connector-skp"]
formats-gltf = ["dep:cad-connector-gltf"]

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-dependencies.workspace = true
cad-geometry.workspace = true
cad-history.workspace = true
cad-measure.workspace = true
cad-connector-core.workspace = true
cad-connector-acadrust.workspace = true
cad-connector-mesh = { workspace = true, optional = true }
cad-connector-step = { workspace = true, optional = true }
cad-connector-ifc = { workspace = true, optional = true }
cad-connector-dgn = { workspace = true, optional = true }
cad-connector-rvt = { workspace = true, optional = true }
cad-connector-skp = { workspace = true, optional = true }
cad-connector-gltf = { workspace = true, optional = true }
cad-representation.workspace = true
cad-scene.workspace = true
cad-query.workspace = true
cad-spatial.workspace = true
cad-diagnostics.workspace = true
cad-platform.workspace = true
cad-resources.workspace = true
# The kernel-independent solid modelling seam (ADR-0036 phase C1): the app
# depends on the **trait** only, never on a kernel. The carrier injects an
# `Arc<dyn SolidModeler>`; a carrier without one refuses by name.
cad-kernel-adapter.workspace = true
serde_json.workspace = true
uuid.workspace = true
serde.workspace = true
