[package]
name = "cad-import-obj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wavefront OBJ adapter: read into the neutral mesh contract and database builder."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-import-core.workspace = true
# `default-features = false` keeps the optional `ahash` hasher (and its
# `getrandom 0.3` transitive) out of the wasm32 build.
tobj.workspace = true
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; `web_time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true
