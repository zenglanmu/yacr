rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ISO 10303-21 (STEP, AP203/AP214/AP242) adapter: tessellate B-rep into the neutral mesh contract."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-import-core.workspace = true
# `cadmpeg-ir` is a direct dependency because `Codec`/`DecodeOptions` live
