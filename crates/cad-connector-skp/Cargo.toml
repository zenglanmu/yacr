[package]
name = "cad-connector-skp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SketchUp (.skp) connector: preview import and 2026/2027 container export via skpwright."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-connector-core.workspace = true
# GPL-3.0-only, pinned exactly. `skpwright` owns the container decode and the
# materialized run meshes (metres); this crate owns the scene walk, visibility
# pruning, face triangulation, the database adapter and the writer.
skpwright.workspace = true
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; `web_time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true

[dev-dependencies]
# The written-container round trip (tests) authors a real PNG texture; the
# importer sniffs the container, so the test needs a genuine encoder, not a
# signature-only stub.
png.workspace = true
