[package]
name = "cad-kernel-solidcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "solidcore adapter: the SolidModeler seam over the pinned solidcore B-rep kernel."

[dependencies]
cad-domain.workspace = true
cad-kernel-adapter.workspace = true

# `solidcore` is a git dependency, not a crates.io one, because the seam needs
# the multi-crate workspace at the pin: `solidcore-ops` (the `Body`/`Body::from_record`
# boundary and the `CancelToken` cancellation hook) and `solidcore-tess` are
# `publish = false` and only exist in the repository, while crates.io 1.0.1 is a
# single crate from an older commit with no cancellation token. Licence
# Apache-2.0 (upstream LICENSE + NOTICE, SMLib port). Upstream repository
# <https://github.com/tangency-labs/solidcore>, pinned to revision
# 55ae49ef919b606bf77901df626ed9bb543e5212 (ADR-0036 D1, unchanged by this
# crate).
#
# Five upstream crates are named directly (all at the same pin, all inside the
# `solidcore` repository, and `scripts/check-architecture.py` allows exactly this
# crate to name them):
#
# - `solidcore-ops`: the `Body`/`Body::from_record` boundary, the cancellation
#   hook and the exact-pcurve call (`pcurve::pcurves_within`);
# - `solidcore-record`: the portable record types;
# - `solidcore-tess` (P2.1c part 1): the display mesher — `plan` over the record
#   and `TessPlan::evaluate`, used by `src/tess.rs` to draw a NURBS face through
#   the `SolidTessellator` seam. `publish = false` upstream, so it only exists at
#   the pin; it is not a `[patch.crates-io]` entry and no other crate may name
#   it;
# - `solidcore`: **only** `eval::form` (`surface`, `curve`, `on_frame`) and the
#   `eval::{Curve, Frame, Surface}` types those functions take — the exact rational
#   NURBS form of a cylinder, cone, sphere or torus face and of a circle/arc edge
#   over a label's parameter range, plus the relabelling of a circle onto a face's
#   frame. That module is the one place the analytic label and the form are proved
#   to be the same geometry; everything else still goes through `solidcore-ops`.
# - `solidcore-convert`: the record↔kernel surface/curve mapping those `form`
#   calls need (`surface`, `record_surface`, `record_curve`; `curve` is used to
#   relabel a circle and to evaluate an edge in the exactness test). It is the
#   same converter `solidcore-ops` already converts through.
#
# `cad-kernel-solidcore` is the only consumer in this workspace
# (`scripts/check-architecture.py` enforces that); no `[patch.crates-io]` entry.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "55ae49ef919b606bf77901df626ed9bb543e5212" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "55ae49ef919b606bf77901df626ed9bb543e5212" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "55ae49ef919b606bf77901df626ed9bb543e5212" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "55ae49ef919b606bf77901df626ed9bb543e5212" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "55ae49ef919b606bf77901df626ed9bb543e5212" }
