[package]
name = "cad-ui-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared Slint controls and responsive layout."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-app.workspace = true
cad-diagnostics.workspace = true
cad-query.workspace = true
cad-measure.workspace = true
cad-render-wgpu.workspace = true
cad-scene.workspace = true
cad-geometry.workspace = true
cad-representation.workspace = true
log.workspace = true

# Android uses the official android-activity backend (Skia behind wgpu). Other
# targets get the selector without a windowing backend: the desktop host is a
# reserved slot (ADR 0002) and the web host is not implemented, so pulling
# winit/glutin there would only add untested dependencies.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = [
    "std", "compat-1-2", "backend-android-activity-06", "renderer-skia",
    "unstable-wgpu-30", "log",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["std", "compat-1-2", "unstable-wgpu-30", "log"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Navigator", "Location", "Storage", "console",
    "Document", "Element", "HtmlCanvasElement",
] }

[build-dependencies]
slint-build.workspace = true
