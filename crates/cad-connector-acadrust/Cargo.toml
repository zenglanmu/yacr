[package]
name = "cad-connector-acadrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "acadrust adapter: read plus database Builder, import report, lossy DXF export."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-connector-core.workspace = true
cad-proxy.workspace = true
cad-resources.workspace = true
cad-diagnostics.workspace = true
cad-geometry.workspace = true
cad-kernel-adapter.workspace = true
acadrust.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
sha2.workspace = true

[dev-dependencies]
# Test-only: the viewport-clip contract tests prove that an imported polygon
# reaches the representation layer's own `parse_paper_clip` as a supported
# polygon (and that a refused boundary is refused there, never drawn).
cad-representation.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
# `std::time::Instant` panics on wasm32-unknown-unknown; `web_time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true
