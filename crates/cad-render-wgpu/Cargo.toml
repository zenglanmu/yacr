[package]
name = "cad-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "2D/3D pipelines, buffers/textures, draw statistics."

[dependencies]
cad-domain.workspace = true
cad-scene.workspace = true
cad-geometry.workspace = true
cad-diagnostics.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true

[dev-dependencies]
# Used only by the offline WGSL validation test; pinned to the exact naga that
# wgpu 30.0.1 embeds so validation matches the runtime parser.
naga = { version = "=30.0.1", features = ["wgsl-in"] }

# Headless software-Vulkan path (native only): blocking on wgpu's async
# adapter/device requests and PNG-encoding the readback for golden inspection.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png.workspace = true
futures-lite.workspace = true

# The browser surface path lives here so wgpu stays inside the renderer crate
# (spec §4.5/§5.3): hosts hand in a canvas, never a wgpu object.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# `std::time::Instant` panics on wasm32-unknown-unknown; `web_time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true
