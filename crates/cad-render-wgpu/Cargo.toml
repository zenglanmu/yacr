[package]
name = "cad-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "2D/3D pipelines, buffers/textures, draw statistics."

[dependencies]
cad-domain.workspace = true
cad-scene.workspace = true
cad-geometry.workspace = true
cad-diagnostics.workspace = true
# Raster image draw items (`ImageBatch`) carry a logical `ResourceKey`; the
# decoded RGBA bytes live in `cad_resources::DecodedImageCache`. This is the
# renderer's only edge to resource decoding (downward: resources never depend on
# the renderer).
cad-resources.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true

[dev-dependencies]
# Used only by the offline WGSL validation test; pinned to the exact naga that
# wgpu 30.0.1 embeds so validation matches the runtime parser. `glsl-out` backs
# the GLSL ES 3.00 (WebGL2) back-translation test of the color shaders.
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
# Tests construct `ImageBatch::clip` polygons, whose `ImageVertex` type is
# defined by `cad-representation` and re-exported through `cad-scene`'s public
# `ImageBatch` field. Test-only (downward) edge; the crate itself does not
# depend on `cad-representation`.
cad-representation.workspace = true

# Headless software-Vulkan path (native only): blocking on wgpu's async
# adapter/device requests and PNG-encoding the readback for golden inspection.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png.workspace = true
futures-lite.workspace = true

# The browser surface path lives here so wgpu stays inside the renderer crate
# (spec §4.5/§5.3): hosts hand in a canvas, never a wgpu object.
#
# `wgpu/webgl` is enabled **only on this wasm32 dependency edge**: Cargo features
# are additive per package, so the native build (which does not activate a
# wasm32-target dependency) keeps exactly the workspace declaration
# `wgpu = "=30.0.1"` with its default features — no `default-features = false`,
# no workspace-wide feature flip, nothing that changes a native backend. `webgl`
# is what compiles wgpu's GLES/WebGL2 backend (`wgpu` → `web` + `wgpu-core/webgl`
# + `wgpu-hal`), and WebGL2 is the only backend the target runtimes have: neither
# WebKitGTK 2.52.6 nor Chromium 141 exposes `navigator.gpu`, so a WebGPU-only wasm
# path would be dead configuration.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
# The two web canvas handles a presenter can own: `HtmlCanvasElement` is what
# `create_surface(SurfaceTarget::Canvas(..))` takes (the page/main-thread carrier),
# `OffscreenCanvas` is what `SurfaceTarget::OffscreenCanvas(..)` takes (a canvas
# transferred into a Worker, ADR 0024 stage ⑧). The window/document/element features
# stay for hosts that resolve the canvas through the DOM, `console` for the explicit
# logging of a refused canvas path.
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "OffscreenCanvas", "console"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# `std::time::Instant` panics on wasm32-unknown-unknown; `web_time` uses
# `Performance.now()` there and re-exports std elsewhere.
web-time.workspace = true
