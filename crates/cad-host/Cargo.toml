[package]
name = "cad-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-common, UI-free host orchestration and open/save/plot funnels."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-app.workspace = true
cad-engine.workspace = true
cad-platform.workspace = true
cad-representation.workspace = true
cad-diagnostics.workspace = true
cad-resources.workspace = true
# The recent-drawings row is a typed wire shape (`camelCase`) that is persisted
# verbatim in the preference document, so the crate needs the derive itself.
serde.workspace = true
# Durable preference document surgery for the leaves that are not part of the
# `ViewerConfig` schema (`wgpu_backend`, the root UI preferences and the
# `recentFiles` array). No version change: the workspace already pins the same
# serde_json.
serde_json.workspace = true
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; `web-time`
# re-exports std elsewhere (no-op off wasm). See `src/lib.rs`/`src/core.rs`.
web-time.workspace = true
