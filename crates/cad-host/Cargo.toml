[package]
name = "cad-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-common, UI-free host orchestration and open/save/plot funnels."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
# `default-features = false` so the wasm `dom-canvas` graph (which reaches
# `cad-app` through this crate) links only the DWG/DXF lanes. A **new shared crate
# between `app-web` and `cad-app` must disable defaults too**, or the bundle
# regains every format. Native carriers enable the default `formats-all`.
#
# Spelled as a path (not `workspace = true`) because this workspace is edition
# 2021: Cargo ignores `default-features` on an inherited edge there. Same package,
# same lock entry — the build graph is unchanged.
cad-app = { path = "../cad-app", default-features = false }
cad-engine.workspace = true
cad-platform.workspace = true
cad-representation.workspace = true
cad-diagnostics.workspace = true
cad-resources.workspace = true
# The recent-drawings row is a typed wire shape (`camelCase`) that is persisted
# verbatim in the preference document, so the crate needs the derive itself.
serde.workspace = true
# Durable preference document surgery for the leaves that are not part of the
# `ViewerConfig` schema (`wgpu_backend`, the root UI preferences and the
# `recentFiles` array). No version change: the workspace already pins the same
# serde_json.
serde_json.workspace = true
# Native `.ymodel` save conflict detection: the `sha256` of the bytes a document
# was opened from (ADR-0037 D12 "no lock file" rule). Hashing only — the archive
# itself stays carrier-owned.
sha2.workspace = true
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; `web-time`
# re-exports std elsewhere (no-op off wasm). See `src/lib.rs`/`src/core.rs`.
web-time.workspace = true

[dev-dependencies]
# The host tests open committed STL/DGN/IFC fixtures, so the test build needs the
# full lane set even though the normal edge above is slim.
cad-app = { workspace = true }
# CHAMFEREDGE's tool-start gate needs an injected `SolidModeler` to prove the
# Viewer refusal happens *before* the capability/selection checks. The seam trait
# is all this test target links (the kernel itself stays carrier-owned; see
# `scripts/check-architecture.py` and ADR-0036).
cad-kernel-adapter.workspace = true
