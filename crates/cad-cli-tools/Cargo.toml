[package]
name = "cad-cli-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless core CLI: scan drawings, proxy reports, commands, benchmarks."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-import-acadrust.workspace = true
cad-proxy.workspace = true
cad-representation.workspace = true
cad-measure.workspace = true
cad-diagnostics.workspace = true
cad-resources.workspace = true
cad-app.workspace = true
serde_json.workspace = true

# The real `render` operation is native-only: it drives the wgpu renderer
# against a headless software-Vulkan adapter. Browser/CLI wasm keeps the
# explicit "unsupported" answer (no device handed in).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cad-scene.workspace = true
cad-render-wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true
