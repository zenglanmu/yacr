[package]
name = "cad-cli-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless core CLI: scan drawings, proxy reports, commands, benchmarks."

[dependencies]
cad-domain.workspace = true
cad-db.workspace = true
cad-connector-acadrust.workspace = true
cad-proxy.workspace = true
cad-representation.workspace = true
cad-measure.workspace = true
cad-diagnostics.workspace = true
cad-resources.workspace = true
cad-platform.workspace = true
cad-app.workspace = true
serde_json.workspace = true

# The real `render` operation is native-only: it drives the wgpu renderer
# against a headless software-Vulkan adapter. Browser/CLI wasm keeps the
# explicit "unsupported" answer (no device handed in).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cad-scene.workspace = true
cad-render-wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The parity harness (`tests/pick_parity.rs`) compares the renderer's id pass
# against CPU picking; `cad-spatial` is the reference precise-pick stage.
cad-spatial.workspace = true

# ADR-0036 phase C1 integration contract (`tests/solid_command.rs`): the **real**
# solidcore modeler, injected exactly as `app-linux` injects it. Dev-only: the
# CLI library itself links no kernel. The crate is `#![cfg(not(wasm32))]`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cad-kernel-adapter.workspace = true
cad-kernel-solidcore.workspace = true

# Real-SketchUp mesh contract (`tests/mesh_real_skp.rs`): import through the
# real SKP adapter and run the real Manifold mesh modeler. Dev-only: the CLI
# itself links neither connector nor mesh kernel.
cad-connector-core.workspace = true
cad-connector-skp.workspace = true
cad-connector-mesh.workspace = true
cad-kernel-manifold.workspace = true
cad-mesh-edit.workspace = true
