name: CI

# Layered CI mirroring the repository's real gate (AGENTS.md "构建", N02 §6).
#
# Jobs actually implemented here:
#   core-quality  : tests + fmt + clippy + architecture boundaries (required)
#   wasm-check    : full-workspace wasm --lib check + a separate app-web check (required)
#   i18n-contracts: bilingual catalog parity + no hardcoded chrome literals (required)
#   android-check : aarch64 UI+host check, capability-dependent (gated, see below)
#
# Jobs required by N02 §6.2 that are NOT implemented yet (see docs/ci.md):
#   web-build, web-smoke, android-apk, shader-validation.
# They need pinned extra toolchains / real runners and must not be faked green.
#
# Action pins: `actions/checkout@v4` and `dtolnay/rust-toolchain@1.98.1` are the
# exact pins already used by this repository. `actions/cache@v4` is the one new
# action; it is pinned by the same major-version tag style (a full commit SHA
# could not be network-verified while authoring this). Replace it with a
# verified full SHA when the repository adopts SHA pinning.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; no job here writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref so stale commits don't hold runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    name: core-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-quality-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-quality-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude cad-ui-slint --exclude app-android --exclude app-web --all-targets --locked -- -D warnings
      - name: Architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Fixture manifest
        run: python3 scripts/check-fixture-manifest.py
      - name: Core contract tests
        run: cargo test --workspace --exclude cad-ui-slint --exclude app-android --exclude app-web --locked --no-fail-fast

  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-check-
      # Full workspace, no UI/host exclusions: this is the gate that exposes
      # host coupling (audit B03) instead of pretending both ends compile.
      - name: Full workspace wasm library check
        run: cargo check --workspace --lib --target wasm32-unknown-unknown --locked
      # Separate check so an app-web regression is locatable independently of
      # unrelated workspace members.
      - name: app-web host coupling check
        run: cargo check -p app-web --target wasm32-unknown-unknown --locked

  i18n-contracts:
    name: i18n-contracts
    # N01/N02: bilingual catalog parity, missing-key detection and the
    # hardcoded-chrome-literal scan (audit U10). This is a pure Python gate, so
    # it needs no Rust toolchain and no Slint host.
    #
    # There is no catalog unit test that can run here: catalog parsing lives in
    # `cad-ui-slint`, which cannot build on a Linux runner without the fontconfig
    # dev headers (see docs/build.md). The script is therefore the whole gate; it
    # is not a substitute for the Slint unit tests, which run on the Android
    # target check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate bilingual catalogs and chrome literals
        run: python3 scripts/check-i18n.py

  android-check:
    name: android-check
    # Capability-dependent (N02 §6.2). GitHub-hosted runners do not ship the
    # pinned JDK 17 / Android SDK / NDK 27.0.12077973 from docs/build.md, so this
    # job is disabled by default. When disabled it is reported as SKIPPED, never
    # as a pass, and the gap is recorded in docs/ci.md "NOT RUN".
    #
    # To enable: set repository variable ANDROID_CI_ENABLED=true and point
    # ANDROID_RUNNER_LABEL at a provisioned runner/label (e.g. "android-ci").
    # The precondition step below fails loudly if the toolchain is absent.
    if: ${{ vars.ANDROID_CI_ENABLED == 'true' }}
    runs-on: ${{ vars.ANDROID_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-check-
      - name: Require pinned Android toolchain (fail loudly when absent)
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set: provision the runner per docs/build.md}"
          : "${JAVA_HOME:?JAVA_HOME (JDK 17) is not set: provision the runner per docs/build.md}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Android target check (UI + host)
        run: cargo check --target aarch64-linux-android -p cad-ui-slint -p app-android --locked
