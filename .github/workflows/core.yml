name: CI

# Layered CI mirroring the repository's real gate (AGENTS.md "构建").
#
# After the UI replacement the desktop host is React/Tauri (`apps/app-linux`,
# bin `yacr`); the Slint crate is gone and the Android/Web/Windows/macOS UIs are
# explicit NOT IMPLEMENTED placeholders. This workflow keeps the genuine
# compile/check gates:
#   core-quality  : fmt, clippy (incl. the Tauri app-linux host), React (Vite)
#                   test + build, architecture boundaries, fixture/workflow/
#                   migration contracts, workspace host debug compilation (required)
#   wasm-check    : full-workspace wasm --lib check + a separate app-web check (required)
#   i18n-contracts: bilingual catalog parity + no hardcoded chrome literals (required)
#   android-check : aarch64 `app-android` placeholder check, capability-gated
#
# The retired platform build/deploy/release jobs live in `.github/workflows/build.yml`
# and are hard-disabled (`if: false`) so they can never publish a stub. See docs/ci.md.
#
# Action pins: `actions/checkout@v4`, `dtolnay/rust-toolchain@1.99.0`,
# `actions/setup-node@v4` and `actions/cache@v4` are pinned by major-version tag
# (a full commit SHA could not be network-verified while authoring this).

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; no job here writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref so stale commits don't hold runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.1"              # pinned Node major/minor (React frontend build)

jobs:
  core-quality:
    name: core-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-quality-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-quality-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Linux host build dependencies (GTK3 / WebKitGTK4.1 / Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkgconf libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Test and build the React frontend (apps/app-linux/ui)
        # The frontend's own node:test suite runs first; clippy and the workspace
        # check then compile the Tauri host, whose `tauri::generate_context!`
        # embeds `apps/app-linux/ui/dist`, so the Vite bundle must exist before
        # the Rust host compiles.
        working-directory: apps/app-linux/ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude app-android --exclude app-web --all-targets --locked -- -D warnings
      - name: Architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Fixture manifest
        run: python3 scripts/check-fixture-manifest.py
      - name: Code file size (tracked code files must stay under the line ceiling)
        run: python3 scripts/check-file-size.py
      - name: Workflow, packaging and migration contracts
        run: |
          python3 scripts/check-workflows.py
          python3 scripts/test-check-file-size.py
          python3 scripts/test-linux-workflow.py
          python3 scripts/test-web-deploy-workflow.py
          python3 scripts/test-package-linux-release.py
          python3 scripts/test-package-windows-release.py
          python3 scripts/test-package-macos-release.py
          python3 scripts/test-fetch-fonts.py
          python3 scripts/test-android-icon.py
          python3 scripts/test-ui-migration-guards.py
      - name: Retained platform-neutral node contracts (no web shell)
        # scripts/test-web-pixels.mjs is the one web-era test kept because it is a
        # pure node zlib PNG decoder with no web-shell/wasm/browser dependency.
        run: node --test scripts/test-web-pixels.mjs
      - name: Workspace host debug compilation (including test code)
        run: cargo check --workspace --all-targets --locked

  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-check-
      # Full workspace, no UI/host exclusions: this is the gate that exposes
      # host coupling instead of pretending both ends compile. `app-linux` is
      # Linux-target-only, so this compiles its empty non-Linux lib.
      - name: Full workspace wasm library check
        run: cargo check --workspace --lib --target wasm32-unknown-unknown --locked
      # Separate check so an app-web regression is locatable independently of
      # unrelated workspace members.
      - name: app-web host coupling check
        run: cargo check -p app-web --target wasm32-unknown-unknown --locked

  i18n-contracts:
    name: i18n-contracts
    # Bilingual catalog parity, missing-key detection and the
    # hardcoded-chrome-literal scan. This is a pure Python gate, so it needs no
    # Rust toolchain and no UI host. Catalog Rust unit tests compile in
    # core-quality but are not executed; this remains the quick Python gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate bilingual catalogs and chrome literals
        run: python3 scripts/check-i18n.py

  android-check:
    name: android-check
    # Capability-dependent. GitHub-hosted runners do not ship the pinned JDK 17 /
    # Android SDK / NDK, so this job is disabled by default. When disabled it is
    # reported as SKIPPED, never as a pass, and the gap is recorded in
    # docs/ci.md "NOT RUN". It compiles the retired `app-android` NOT IMPLEMENTED
    # placeholder only; the deleted Slint UI crate is NOT part of the gate.
    #
    # To enable: set repository variable ANDROID_CI_ENABLED=true and point
    # ANDROID_RUNNER_LABEL at a provisioned runner/label (e.g. "android-ci").
    # The precondition step below fails loudly if the toolchain is absent.
    if: ${{ vars.ANDROID_CI_ENABLED == 'true' }}
    runs-on: ${{ vars.ANDROID_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-check-
      - name: Require pinned Android toolchain (fail loudly when absent)
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set: provision the runner per docs/build.md}"
          : "${JAVA_HOME:?JAVA_HOME (JDK 17) is not set: provision the runner per docs/build.md}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Android target check (retired placeholder)
        run: cargo check --target aarch64-linux-android -p app-android --locked
