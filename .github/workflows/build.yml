name: CI build layers

# Layered CI mirroring the repository's real gate. After the UI replacement the
# desktop host is React/Tauri, the retired UI crate is gone and the Android/Windows/
# macOS UIs are explicit NOT IMPLEMENTED placeholders.
#
# Real (genuine) jobs:
#   linux-app        : debug host compilation of the Tauri `app-linux` host
#                      (frontend built first; no offscreen rendering)
#   windows-check    : native MSVC debug compilation of the `app-windows` host
#                      (windows-latest; compile gate only)
#   macos-check      : native macOS debug compilation of the real `app-macos`
#                      host (transparent WKWebView + native CAD NSView + wgpu/
#                      Metal), frontend built first; compile gate only
#   shader-validation: offline naga WGSL test (no GPU needed; forced to fail on
#                      a broken shader)
#   web-build        : `scripts/build-web.sh` builds the real wasm CAD bundle
#                      (`apps/app-web/dist`, ADR 0024) and uploads it; the pinned
#                      wasm-bindgen CLI is installed, never taken from PATH drift.
#                      The same job builds the shared React chrome bundle
#                      (`scripts/build-web-ui.sh` -> `apps/app-web/dist-ui`) and
#                      uploads it as `web-ui-dist`
#   web-smoke        : headless Chromium loads the built bundle, starts the wasm
#                      session and asserts the status line. The runner has no
#                      GPU: this is **software rendering** (SwiftShader) and is
#                      neither GPU nor pixel evidence
#   web-deploy       : publishes the shared chrome bundle web-build uploaded
#                      (`web-ui-dist`, `BUNDLE_KIND=ui`) to Cloudflare Pages —
#                      only on `v*` tags or a manual dispatch, never on a routine
#                      push/PR. The published entry point is the project's own
#                      `pages.dev` hostname (`yacr-examples.pages.dev`); custom
#                      domains are Cloudflare-side configuration this workflow
#                      does not attach or manage. Upload is deployment evidence
#                      only (no runtime/GPU/pixel claim); the vanilla harness
#                      bundle is still built and smoked but is not what the site
#                      serves
#
# Release packaging jobs (re-enabled 2026-11-01) — event-gated to a `v*` tag or a
# manual `workflow_dispatch`, never a routine push/PR. They build real artifacts
# for the current React/Tauri hosts (no retired UI toolkit anywhere) and upload them as
# workflow artifacts. When the matching repository credentials exist they also
# **sign with LOCAL, SELF-SIGNED material** (switched 2026-11-05):
#   * Windows: a repository self-signed PFX (GitHub secret) imported on the
#     runner and applied with `signtool`; the PUBLIC certificate ships as
#     `yacr-dev-codesign.cer` (next to the executables at the package root) so
#     users can trust it manually;
#   * Android: a repository self-signed keystore (GitHub secret) applied with
#     `apksigner` after `zipalign`; the SHA-256 and `apksigner verify` output are
#     published next to the APK;
#   * macOS: ad-hoc `codesign --sign -` by default (an explicit
#     `vars.MACOS_SIGN_IDENTITY` overrides it); never notarized.
# The Linux Flatpak is signed through a repository GPG key (OSTree commit
# signature). These are NOT public-CA / Authenticode-trusted / Developer ID
# signatures, nothing is notarized and SignPath is no longer wired into CI.
# Without credentials the signing steps are skipped and the uploaded artifact is
# named `*-unsigned`. Publishing, notarization and store uploads stay out of this
# file: `publish-release.yml` is the only write-scoped publisher.
#   linux-release   : Flatpak bundle (`scripts/package-linux-release.sh`)
#   windows-release : MSVC release zip (`scripts/package-windows-release.sh`)
#   macos-release   : universal Yacr.app tarball (`scripts/package-macos-release.sh`)
#   (a debug APK is still produced locally by `scripts/build-android.sh --debug`;
#    it is deliberately not a CI release artifact)
#   android-release : release APK (`scripts/build-android.sh --release`), aligned
#                     and optionally apksigner-signed from the repository keystore
#
# Each job provisions its own toolchain (Flatpak runtime/SDK, JDK 17 + Android
# SDK/NDK, Node for the embedded React bundle). When the event gate is not met
# GitHub reports the job as skipped, never as a pass.
#
# `scripts/build-web.sh` and `scripts/deploy-cloudflare-pages.sh` are real entry
# points again; the browser bundle is not a shipped product and its runtime
# evidence boundary is documented in docs/build.md.
#
# No job sets `continue-on-error`, so a green check is a real pass.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: read-only. Artifact upload needs no repo write permission;
# `actions: read` is kept read-only (no signing step downloads an uploaded
# artifact any more — signing happens on the staged files in place).
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.1"              # pinned Node major/minor (React frontend build)

jobs:
  linux-app:
    name: linux-app (debug compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Linux debug check
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-app-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-app-
      - name: Install Linux host build dependencies (GTK3 / WebKitGTK4.1 / Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkgconf libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Test and build the React frontend (apps/desktop-ui)
        # The frontend's own node:test suite runs first so the native compile gate
        # also exercises the React logic; `tauri::generate_context!` embeds
        # `apps/desktop-ui/dist` at compile time, so the Vite bundle must exist
        # before the Rust host is checked.
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Linux host debug compilation
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          cargo check -p app-linux --all-targets --locked 2>&1 | tee linux-app.log
          git diff --exit-code -- Cargo.lock
          {
            echo '## Linux App debug compilation'
            echo 'The React/Tauri host and its contract test code compiled; tests were not executed.'
            echo 'Window/GPU rendering and release compilation are not default gates.'
            echo 'This is not runtime, visual, desktop-window or real-GPU acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux compilation log (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: linux-app.log
          if-no-files-found: warn
          retention-days: 14

  windows-check:
    name: windows-check (native MSVC debug compile)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache Windows debug check
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-check-
      - name: Windows host debug compilation (MSVC)
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p app-windows --all-targets --locked 2>&1 | tee windows-check.log
          {
            echo '## Windows host debug compilation (MSVC)'
            echo 'The NOT IMPLEMENTED `app-windows` placeholder compiled for the MSVC host; nothing was executed.'
            echo 'This is not a real-Windows, real-GPU or native-file-dialog acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows compilation log (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check
          path: windows-check.log
          if-no-files-found: warn
          retention-days: 14

  macos-check:
    name: macos-check (native macOS debug compile)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache macOS debug check
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-check-
      - name: Test and build the React frontend (apps/desktop-ui)
        # `tauri::generate_context!` embeds `apps/desktop-ui/dist` at compile
        # time, so the shared React bundle must exist before the Rust host is
        # checked. The frontend suite runs first so this gate also exercises the
        # React logic, exactly like `linux-app`.
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm test
          npm run build
      - name: macOS host debug compilation (arm64)
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p app-macos --all-targets --locked 2>&1 | tee macos-check.log
          git diff --exit-code -- Cargo.lock
          {
            echo '## macOS host debug compilation'
            echo 'The React/Tauri macOS host (transparent WKWebView + native CAD NSView + wgpu/Metal) and its contract test code compiled; nothing was executed.'
            echo 'This is not a real-Mac window, Metal-GPU, z-order, DPI, native-dialog or visual acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS compilation log (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-check
          path: macos-check.log
          if-no-files-found: warn
          retention-days: 14

  shader-validation:
    name: shader-validation
    # Offline WGSL parse/validate via the naga dev-dependency of cad-render-wgpu;
    # no GPU or display is required. The test also asserts a deliberately broken
    # shader fails, so it cannot silently become a no-op.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-shader-validation-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shader-validation-

      - name: WGSL naga validation (offline, no GPU)
        run: cargo test -p cad-render-wgpu --test wgsl_validation --locked

  # --- Retired platform build/deploy/release jobs ---------------------------
  # Each is declared (so the gap is visible) but hard-disabled with an
  # unconditional `if: false`. Deliberately NOT a mutable `vars.…` switch: a repo
  # variable could accidentally re-enable a stub publish. See scripts/check-workflows.py.

  linux-release:
    name: linux-release (Flatpak — tags/dispatch only)
    # Builds the real React/Tauri Linux host as a Flatpak bundle. The manifest
    # installs a prebuilt payload against org.gnome.Platform//51, so the job
    # installs that runtime/SDK and flatpak-builder. Artifact only: it is not
    # published to Flathub and is not a runtime/GPU/pixel acceptance.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Optional Flatpak OSTree/GPG signing. Secrets cannot be read in a job-level
      # `if:`, so they are exposed here and the steps gate on the env instead.
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Linux release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-release-
      - name: Install Linux host deps and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkgconf libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            flatpak flatpak-builder ostree gnupg
      - name: Install the GNOME runtime and SDK used by the manifest
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Prefetch crates for the locked release build
        run: cargo fetch --locked
      - name: Fail if a Flatpak signing key id is configured without a key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FLATPAK_GPG_KEY_ID:-}" ] && [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::FLATPAK_GPG_KEY_ID is set but FLATPAK_GPG_PRIVATE_KEY is empty; refusing to build a Flatpak that cannot be signed" >&2
            exit 1
          fi
      - name: Import the Flatpak GPG signing key
        if: env.FLATPAK_GPG_PRIVATE_KEY != '' && env.FLATPAK_GPG_KEY_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          # gpg-preset-passphrase only works when the agent is told so up front.
          printf '%s\n' 'allow-preset-passphrase' > "$GNUPGHOME/gpg-agent.conf"
          gpg-connect-agent reloadagent /bye >/dev/null
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "${FLATPAK_GPG_PASSPHRASE:-}" ]; then
            preset="$(command -v gpg-preset-passphrase || true)"
            for candidate in "$preset" \
                             /usr/lib/gnupg/gpg-preset-passphrase \
                             /usr/libexec/gpg-preset-passphrase; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                preset="$candidate"
                break
              fi
            done
            [ -n "$preset" ] || { echo "::error::gpg-preset-passphrase not found" >&2; exit 1; }
            while IFS= read -r grip; do
              [ -n "$grip" ] || continue
              "$preset" --preset "$grip" <<< "$FLATPAK_GPG_PASSPHRASE"
            done < <(gpg --batch --with-colons --with-keygrip --list-secret-keys \
                       "${FLATPAK_GPG_KEY_ID:-}" \
                       | grep '^grp:' | cut -d: -f10)
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Cache the downloaded CAD font catalogue
        # scripts/fetch-fonts.sh caches per file under ~/.cache/yacr/fonts;
        # restore the newest run's cache so this job does not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/yacr/fonts
          key: ${{ runner.os }}-yacr-fonts-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yacr-fonts-
      - name: Build and package the Linux Flatpak
        id: build-linux
        env:
          FLATPAK_REMOTE_DEPS: flathub
          FLATPAK_REMOTE_BUILD: flathub
          # Full mlightcad catalogue staged through scripts/fetch-fonts.sh, the
          # same path Windows/macOS release packaging uses; WITH_FONTS=0 keeps
          # only the committed fonts/ for an offline build.
          WITH_FONTS: "1"
        run: |
          set -euo pipefail
          if [ -n "${FLATPAK_GPG_KEY_ID:-}" ]; then
            echo "signing: package-linux-release.sh passes --gpg-sign=${FLATPAK_GPG_KEY_ID} to flatpak-builder"
          else
            echo "signing: FLATPAK_GPG_KEY_ID is not set; the bundle will be UNSIGNED"
          fi
          bash scripts/package-linux-release.sh
      - name: Record packaging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux release Flatpak'
            echo 'Built io.github.zenglanmu.yacr from the React/Tauri host on ubuntu-latest.'
            if [ "${{ steps.build-linux.outcome }}" = "success" ] \
               && [ -n "${FLATPAK_GPG_KEY_ID:-}" ] \
               && ls target/release/dist/*.flatpak.gpg >/dev/null 2>&1; then
              echo 'The OSTree commit is GPG-signed; verify with `flatpak install --user --gpg-file=<bundle>.gpg <bundle>`.'
            else
              echo 'UNSIGNED or signing did not complete: no verified GPG-signed Flatpak was published.'
            fi
            echo 'The bundle is not published to Flathub and is not window/GPU acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Linux release Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: yacr-linux-release
          path: |
            target/release/dist/*.flatpak
            target/release/dist/*.flatpak.sha256
            target/release/dist/*.flatpak.gpg
          if-no-files-found: error
          retention-days: 30

  windows-release:
    name: windows-release (MSVC zip — tags/dispatch only)
    # Builds and packages the real React/Tauri Windows host. The script builds
    # the frontend first (tauri::generate_context! embeds desktop-ui/dist) and
    # links the MSVC CRT statically. With a repository self-signed PFX the staged
    # exes are Authenticode-signed before zipping (SELF-SIGNED: not a public CA)
    # and the public certificate is shipped as yacr-dev-codesign.cer (next to the
    # executables at the package root); without
    # it the zip is explicitly UNSIGNED. The ZIP container is never signed.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    # Build + signing/packaging.
    timeout-minutes: 150
    env:
      # Secrets cannot be read in a job-level `if:`, so expose them here and gate
      # every signing step on `env.WINDOWS_SELF_SIGNED_PFX_BASE64`.
      # Empty = unsigned build.
      WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
      WINDOWS_SELF_SIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Windows release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-release-
      - name: Cache the downloaded CAD font catalogue
        # scripts/fetch-fonts.sh caches per file under ~/.cache/yacr/fonts;
        # restore the newest run's cache so this job does not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/yacr/fonts
          key: ${{ runner.os }}-yacr-fonts-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yacr-fonts-
      - name: Build and stage the Windows release (no zip yet)
        shell: bash
        env:
          WITH_FONTS: "1"
          # CI signs *.exe (package root) first; scripts/finalize-windows-release.sh writes
          # the zip afterwards so the archive carries the real signing state.
          SKIP_ZIP: "1"
        run: |
          set -euo pipefail
          bash scripts/package-windows-release.sh
          DIST="target/x86_64-pc-windows-msvc/release/dist"
          stage="$(find "$DIST" -maxdepth 1 -type d -name 'yacr-*-windows-x86_64' | head -1)"
          test -n "$stage" \
            || { echo "::error::no yacr-*-windows-x86_64 stage directory under $DIST" >&2; exit 1; }
          echo "WINDOWS_STAGE=$stage" >> "$GITHUB_ENV"
          echo "staged: $stage"
      - name: Sign the staged executables with the repository self-signed PFX
        id: verify-windows
        if: env.WINDOWS_SELF_SIGNED_PFX_BASE64 != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_SELF_SIGNED_PFX_PASSWORD)) {
            throw 'WINDOWS_SELF_SIGNED_PFX_BASE64 is set but WINDOWS_SELF_SIGNED_PFX_PASSWORD is empty; refusing to import an unprotected PFX'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yacr-self-signed.pfx'
          $cer = Join-Path $env:WINDOWS_STAGE 'yacr-dev-codesign.cer'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SELF_SIGNED_PFX_BASE64))
            $password = ConvertTo-SecureString -String $env:WINDOWS_SELF_SIGNED_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert) { throw "Import-PfxCertificate returned no certificate for $pfx" }
            if ($cert -is [array]) {
              throw 'the PFX must contain exactly one self-signed code-signing certificate (no chain)'
            }
            # Ship the PUBLIC certificate next to the executables so users can
            # trust it manually (Trusted Root / Trusted Publishers).
            Export-Certificate -Cert $cert -FilePath $cer -Type CERT | Out-Null
            # Authenticode validates a chain, so a self-signed cert imported only
            # into CurrentUser\My still reports UnknownError. Trust it in this
            # ephemeral runner's CurrentUser\Root before verifying. This makes the
            # check meaningful without pretending the signature is publicly trusted.
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
            if (-not $signtool) {
              $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
              $signtool = Get-ChildItem -Path $kits -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
                Where-Object { Test-Path -LiteralPath $_ } |
                Select-Object -First 1
            }
            if (-not $signtool) { throw 'signtool.exe was not found (install the Windows SDK build tools)' }
            $thumbprint = $cert.Thumbprint
            foreach ($exe in @(
                (Join-Path $env:WINDOWS_STAGE 'yacr-windows.exe'),
                (Join-Path $env:WINDOWS_STAGE 'cad-cli-tools.exe'))) {
              & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_SELF_SIGNED_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for ${exe} (exit $LASTEXITCODE)" }
              $sig = Get-AuthenticodeSignature -FilePath $exe
              if ($sig.Status -ne 'Valid') {
                throw "Authenticode signature is not valid for ${exe}: $($sig.Status)"
              }
              if ($sig.SignerCertificate.Thumbprint -ne $thumbprint) {
                throw "Authenticode signer for ${exe} is $($sig.SignerCertificate.Thumbprint), expected $thumbprint"
              }
              Write-Host "${exe}: SELF-SIGNED by $($sig.SignerCertificate.Subject)"
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Authenticode signatures are **SELF-SIGNED** (repository certificate). `Get-AuthenticodeSignature` reports `Valid` only because the certificate was imported on this runner; this is not public trust.'
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Finalize the signed Windows release zip
        if: env.WINDOWS_SELF_SIGNED_PFX_BASE64 != ''
        shell: bash
        run: bash scripts/finalize-windows-release.sh --signed "$WINDOWS_STAGE" target/x86_64-pc-windows-msvc/release/dist
      - name: Upload the signed Windows release zip
        if: env.WINDOWS_SELF_SIGNED_PFX_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: yacr-windows-release
          path: |
            target/x86_64-pc-windows-msvc/release/dist/*.zip
            target/x86_64-pc-windows-msvc/release/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Finalize the unsigned Windows release zip
        if: env.WINDOWS_SELF_SIGNED_PFX_BASE64 == ''
        shell: bash
        run: bash scripts/finalize-windows-release.sh --unsigned "$WINDOWS_STAGE" target/x86_64-pc-windows-msvc/release/dist
      - name: Upload the unsigned Windows release zip
        if: env.WINDOWS_SELF_SIGNED_PFX_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: yacr-windows-release-unsigned
          path: |
            target/x86_64-pc-windows-msvc/release/dist/*.zip
            target/x86_64-pc-windows-msvc/release/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Record packaging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Windows release package (MSVC)'
            echo 'Built and packaged the React/Tauri host on windows-latest; the CRT is linked statically.'
            if [ "${{ steps.verify-windows.outcome }}" = "success" ]; then
              echo '*.exe (package root) carry a SELF-SIGNED Authenticode signature (repository certificate, not a public CA) and were verified with Get-AuthenticodeSignature. Import yacr-dev-codesign.cer into Trusted Root / Trusted Publishers to avoid the "unknown publisher" prompt. No SmartScreen reputation and no public trust is claimed; the ZIP container itself is not signed.'
            else
              echo 'UNSIGNED or signing did not complete: this zip is the explicit unsigned fallback (no verified Authenticode signature).'
            fi
            echo 'window/GPU/native-dialog behaviour is not exercised.'
          } >> "$GITHUB_STEP_SUMMARY"

  macos-release:
    name: macos-release (universal Yacr.app — tags/dispatch only)
    # Builds the real React/Tauri macOS host (WKWebView + native CAD NSView +
    # wgpu/Metal) as a universal Yacr.app tarball. The script builds the frontend
    # before cargo (generate_context! embeds desktop-ui/dist). The app and the CLI
    # are ad-hoc code-signed (`codesign --sign -`) unless
    # `vars.MACOS_SIGN_IDENTITY` names an identity. Artifact only: never
    # notarized, so Gatekeeper still blocks it on other Macs.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache macOS release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-release-
      - name: Cache the downloaded CAD font catalogue
        # scripts/fetch-fonts.sh caches per file under ~/.cache/yacr/fonts;
        # restore the newest run's cache so this job does not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/yacr/fonts
          key: ${{ runner.os }}-yacr-fonts-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yacr-fonts-
      - name: Build and package the macOS release (universal)
        shell: bash
        env:
          MACOS_ARCH: universal
          WITH_FONTS: "1"
          # Empty (unset variable) means the script signs ad-hoc with `-`.
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: bash scripts/package-macos-release.sh
      - name: Verify the code signature in the tarball
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          tarball="$(find target/macos -type f -name '*.tar.gz' | head -1)"
          test -n "$tarball" \
            || { echo "::error::no macOS release tarball under target/macos" >&2; exit 1; }
          rm -rf target/macos/verify
          mkdir -p target/macos/verify
          tar -xzf "$tarball" -C target/macos/verify
          app="$(find target/macos/verify -maxdepth 2 -type d -name 'Yacr.app' | head -1)"
          cli="$(find target/macos/verify -maxdepth 3 -type f -path '*/bin/cad-cli-tools' | head -1)"
          test -n "$app" \
            || { echo "::error::Yacr.app is missing from the extracted tarball" >&2; exit 1; }
          test -n "$cli" \
            || { echo "::error::bin/cad-cli-tools is missing from the extracted tarball" >&2; exit 1; }
          # Verification only: a failed seal is fatal, a missing ad-hoc marker is
          # not (the identity may be a real certificate).
          codesign --verify --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$cli"
          codesign -dv "$app" 2>&1 | tee target/macos/verify/codesign-app.txt || true
          if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            if grep -q 'Signature=adhoc' target/macos/verify/codesign-app.txt; then
              echo 'Signature=adhoc (ad-hoc, not notarized)'
            else
              echo 'note: codesign -dv did not report Signature=adhoc for the app'
            fi
          fi
          {
            echo '## macOS code signature'
            if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
              echo 'The app and CLI are **ad-hoc signed** (`codesign --sign -`) and NOT notarized. Gatekeeper still blocks first launch on other Macs; the package is not Developer ID signed.'
            else
              echo 'The app and CLI are signed with the configured identity `'"${MACOS_SIGN_IDENTITY}"'`; this workflow does NOT notarize.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record packaging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## macOS release package (universal)'
            echo 'Built and packaged the React/Tauri host on macos-latest; Mach-O deps are checked to be system-only.'
            echo 'The app and CLI are code-signed by scripts/package-macos-release.sh: ad-hoc by default, or with vars.MACOS_SIGN_IDENTITY. The package is NOT notarized, so Gatekeeper still blocks it on other Macs, and window/Metal/DPI behaviour is not exercised.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the macOS release tarball
        uses: actions/upload-artifact@v4
        with:
          name: yacr-macos-release
          path: |
            target/macos/universal/dist/*.tar.gz
            target/macos/universal/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  android-release:
    name: android-release (signed APK — tags/dispatch only)
    # Builds the release variant of the Tauri Android host, aligns the unsigned
    # APK with zipalign and signs it with the repository keystore via apksigner;
    # the signed APK is verified with apksigner and checksummed, and the signer
    # certificate transcript is published as SIGNING.txt. This job REFUSES to run
    # without a keystore: it only publishes a signed APK. No device/emulator and
    # no store upload.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Build + signing/packaging.
    timeout-minutes: 180
    env:
      # The release keystore is mandatory: a missing key fails the preflight
      # step below instead of producing an unsigned APK. It is a repository
      # self-signed key, not a Play upload key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fail if the release keystore is not configured
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; android-release only publishes a signed APK" >&2; exit 1; }
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          [ -n "${ANDROID_KEY_ALIAS:-}" ] \
            || { echo "::error::ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] \
            || { echo "::error::ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache cargo (registry / git / target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-release-
      - name: Provision the pinned Android SDK/NDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ] \
            || { echo "::error::sdkmanager not found under $ANDROID_HOME" >&2; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;29.0.13846066"
          set -o pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - name: Install the pinned wasm-bindgen CLI and npm deps
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^readonly YACR_PINNED_WASM_BINDGEN="\(.*\)"$/\1/p' scripts/lib/wasm-toolchain.sh)"
          test -n "$pin" || { echo "no wasm-bindgen pin in scripts/lib/wasm-toolchain.sh" >&2; exit 1; }
          case "$pin" in
            0.2.129)
              sha="82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e" ;;
            *)
              echo "no verified download for wasm-bindgen $pin; add its release SHA-256 to this step" >&2
              exit 1 ;;
          esac
          archive="wasm-bindgen-${pin}-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${pin}/${archive}.tar.gz" \
            -o "/tmp/${archive}.tar.gz"
          echo "${sha}  /tmp/${archive}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/${archive}.tar.gz" -C /tmp
          install "/tmp/${archive}/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          wasm-bindgen --version | grep -Fx "wasm-bindgen ${pin}"
          ( cd apps/desktop-ui && npm ci )
          ( cd apps/app-android && npm ci )
      - name: Cache the downloaded CAD font catalogue
        # scripts/fetch-fonts.sh caches per file under ~/.cache/yacr/fonts;
        # restore the newest run's cache so this job does not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/yacr/fonts
          key: ${{ runner.os }}-yacr-fonts-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yacr-fonts-
      - name: Build the release APK (unsigned)
        env:
          # Full mlightcad catalogue staged by scripts/build-android-ui.sh
          # (the APK's assets/fonts); WITH_FONTS=0 keeps the committed subset.
          WITH_FONTS: "1"
        run: bash scripts/build-android.sh --release --target aarch64
      - name: Fail if Cargo.lock was rewritten
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
      - name: Align the unsigned release APK for signing
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ZIPALIGN" \
            || { echo "::error::zipalign not found at $ZIPALIGN" >&2; exit 1; }
          SRC="apps/app-android/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$SRC" || { echo "::error::unsigned release APK missing: $SRC" >&2; exit 1; }
          # A cached `target/` may still hold a previous signed/unsigned APK.
          rm -rf target/android-signing target/android-signed
          mkdir -p target/android-signing
          # zipalign must run BEFORE signing; re-aligning afterwards breaks v2+.
          "$ZIPALIGN" -p -f 4 "$SRC" target/android-signing/app-universal-release.apk
          test -s target/android-signing/app-universal-release.apk \
            || { echo "::error::zipalign produced no APK" >&2; exit 1; }
      - name: Sign the aligned APK with the repository keystore
        id: sign-android
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is set" >&2; exit 1; }
          [ -n "${ANDROID_KEY_ALIAS:-}" ] \
            || { echo "::error::ANDROID_KEY_ALIAS is required when ANDROID_KEYSTORE_BASE64 is set" >&2; exit 1; }
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] \
            || { echo "::error::ANDROID_KEY_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is set" >&2; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER" \
            || { echo "::error::apksigner not found at $APKSIGNER" >&2; exit 1; }
          KS="$RUNNER_TEMP/yacr-release.keystore"
          # Remove the decoded private key even when signing fails.
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS" \
            || { echo "::error::decoding ANDROID_KEYSTORE_BASE64 produced an empty file" >&2; exit 1; }
          rm -rf target/android-signed
          mkdir -p target/android-signed
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out target/android-signed/app-universal-release.apk \
            target/android-signing/app-universal-release.apk
          test -s target/android-signed/app-universal-release.apk \
            || { echo "::error::apksigner produced no APK" >&2; exit 1; }
          # The verify transcript is the published signer-certificate evidence.
          "$APKSIGNER" verify --verbose --print-certs \
            target/android-signed/app-universal-release.apk | tee target/android-signed/SIGNING.txt
          ( cd target/android-signed \
              && sha256sum app-universal-release.apk > app-universal-release.apk.sha256 )
      - name: Upload the signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: target/android-signed/**
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact facts
        if: always()
        run: |
          set -euo pipefail
          find apps/app-android/src-tauri/gen/android/app/build/outputs/apk \
            -type f -name '*.apk' -printf '%p %s bytes\n' || true
          {
            echo '## android-release'
            if [ "${{ steps.sign-android.outcome }}" = "success" ]; then
              echo 'The aligned release APK was signed with the repository self-signed keystore using apksigner; SIGNING.txt carries the `apksigner verify --print-certs` transcript and the APK SHA-256 is published alongside. This is not a Play/upload key and imposes no store acceptance.'
            else
              echo 'SIGNING DID NOT COMPLETE: this job only publishes a signed APK, and a missing keystore fails the preflight step.'
            fi
            echo 'No device/emulator was used and nothing was published.'
          } >> "$GITHUB_STEP_SUMMARY"

  web-build:
    name: web-build (wasm CAD bundle)
    # `scripts/build-web.sh` builds the real `surfaceMode: dom-canvas` session
    # (`apps/app-web`, ADR 0024) into `apps/app-web/dist`: wasm32 release build,
    # pinned wasm-bindgen `--target web`, assembled shell. The CLI version must
    # equal the workspace pin, so it is installed from the pinned prebuilt release
    # and verified — never taken from whatever `wasm-bindgen` happens to be on PATH.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache web wasm build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-build-
      - name: Install the pinned wasm-bindgen CLI
        run: |
          set -euo pipefail
          # The pin lives in the shared toolchain library (the scripts compare the
          # CLI against Cargo.toml anyway); this step fetches exactly the prebuilt
          # static musl release for it and verifies the published SHA-256.
          pin="$(sed -n 's/^readonly YACR_PINNED_WASM_BINDGEN="\(.*\)"$/\1/p' scripts/lib/wasm-toolchain.sh)"
          test -n "$pin" || { echo "no wasm-bindgen pin in scripts/lib/wasm-toolchain.sh" >&2; exit 1; }
          case "$pin" in
            0.2.129)
              sha="82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e" ;;
            *)
              echo "no verified download for wasm-bindgen $pin; add its release SHA-256 to this step" >&2
              exit 1 ;;
          esac
          archive="wasm-bindgen-${pin}-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${pin}/${archive}.tar.gz" \
            -o "/tmp/${archive}.tar.gz"
          echo "${sha}  /tmp/${archive}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/${archive}.tar.gz" -C /tmp
          install "/tmp/${archive}/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          wasm-bindgen --version | grep -Fx "wasm-bindgen ${pin}"
          grep -A2 'name = "wasm-bindgen"' Cargo.lock | grep -q "version = \"${pin}\"" \
            || { echo "Cargo.lock wasm-bindgen does not match the installed CLI pin $pin" >&2; exit 1; }
      - name: Cache the downloaded CAD font catalogue
        # scripts/fetch-fonts.sh caches per file under ~/.cache/yacr/fonts;
        # restore the newest run's cache so this job does not re-download it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/yacr/fonts
          key: ${{ runner.os }}-yacr-fonts-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yacr-fonts-
      - name: Build the browser bundle
        env:
          WITH_FONTS: "1"
        run: bash scripts/build-web.sh
      - name: Upload the browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/app-web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Install the React frontend dependencies
        # `scripts/build-web-ui.sh` refuses to run without `node_modules`; the
        # lockfile is checked in, so the install is reproducible and offline-safe
        # relative to the previous step's registry fetch.
        working-directory: apps/desktop-ui
        run: npm ci
      - name: Build the shared chrome bundle (browser + Android runtime)
        # Same wasm session, but the React chrome compiled with
        # `__YACR_RUNTIME__=web`; `apps/app-web/dist` above stays untouched.
        env:
          WITH_FONTS: "1"
        run: bash scripts/build-web-ui.sh
      - name: Upload the shared chrome bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-dist
          path: apps/app-web/dist-ui
          if-no-files-found: error
          retention-days: 7

  web-smoke:
    name: web-smoke (headless Chromium, software rendering)
    # Loads the bundle this run built, starts the wasm session and asserts its
    # typed status. The runner has no GPU and Chromium renders through SwiftShader
    # here: this is a carrier/status smoke, **not** GPU, pixel or performance
    # evidence (the log line says which rendering class was measured).
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/app-web/dist
      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/web-smoke" --no-save --no-package-lock playwright@1.64.1
          (cd "$RUNNER_TEMP/web-smoke" && npx playwright install --with-deps chromium)
      - name: Headless browser smoke
        run: |
          set -euo pipefail
          python3 scripts/serve-web.py --directory apps/app-web/dist --port 8090 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8090/ >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          NODE_PATH="$RUNNER_TEMP/web-smoke/node_modules" \
            node scripts/web-smoke.cjs \
              --url http://127.0.0.1:8090/ \
              --screenshot "$RUNNER_TEMP/web-smoke.png"
      - name: Upload the diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-diagnostic
          path: ${{ runner.temp }}/web-smoke.png
          if-no-files-found: warn
          retention-days: 7

  web-deploy:
    name: web-deploy (Cloudflare Pages — tags/dispatch only)
    # Publishes the exact artifact web-build uploaded, and only for a `v*` tag or
    # a manual dispatch: a routine push/PR never goes public. The entry point is
    # the project's own pages.dev hostname; the deploy script validates every
    # bundle artifact before uploading and never manages a custom domain. A
    # successful upload is deployment evidence only — the smoke job above stays
    # software-rendering.
    #
    # The uploaded bundle carries **no fonts**: the site fetches them lazily from
    # same-origin `fonts/` after a document opens. The deploy step therefore needs
    # outbound network (the runner has it) to assemble the full CDN package with
    # `scripts/fetch-fonts.sh` into `apps/app-web/dist-ui/fonts` before uploading;
    # that package is part of the published site, not of the build artifact.
    needs: web-build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui-dist
          path: apps/app-web/dist-ui
      - name: Publish the shared chrome bundle and the CDN font package to Cloudflare Pages
        # `scripts/deploy-cloudflare-pages.sh` downloads the font package itself
        # (`scripts/fetch-fonts.sh`); `SKIP_FONTS` stays unset so a failed download
        # fails the deploy instead of publishing a site whose `fonts/` is missing.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: yacr-examples
          CF_PAGES_BRANCH: main
          DIST: ${{ github.workspace }}/apps/app-web/dist-ui
          BUNDLE_KIND: ui
          SKIP_BUILD: "1"
        run: bash scripts/deploy-cloudflare-pages.sh
