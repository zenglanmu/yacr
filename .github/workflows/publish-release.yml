name: Publish release assets

# Manual, explicit publication of an existing build's workflow artifacts to the
# public GitHub Release for a tag. GitHub Actions artifacts themselves are never
# publicly downloadable (they require authentication and expire), so a release is
# the only public distribution surface.
#
# Division of responsibility:
#   * `build.yml` release jobs stay `contents: read` and artifact-only - they
#     build, verify and upload. When repository credentials exist they may also
#     **sign** with LOCAL SELF-SIGNED material (a Windows PFX secret applied by
#     signtool, an Android keystore secret applied by the Android signer, macOS
#     ad-hoc signing) and the Linux Flatpak through a repository GPG key; without
#     credentials they upload an explicitly `*-unsigned` fallback. None of that is
#     public-CA trust and nothing is notarized. They never publish;
#   * this workflow is the **single** writer: it downloads the platform
#     artifacts from a named build run and attaches them to the tag's release.
#     It never builds or signs anything, so a green run here is packaging/upload
#     evidence only - not a runtime, GPU, device or visual acceptance.
#
# It is `workflow_dispatch`-only: a push, PR or tag can never publish by itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.4)
        required: true
        type: string
      run_id:
        description: "`CI build layers` run id whose artifacts to attach"
        required: true
        type: string
      notes_file:
        description: Release notes file in this repository (empty = generated notes)
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (artifacts -> public GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download the platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf artifacts && mkdir -p artifacts
          for name in \
            yacr-linux-release \
            yacr-macos-release
          do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$name" -D "artifacts/$name"
          done
          # Windows and Android may be signed or the explicit unsigned fallback
          # from the same run. Resolve the artifact *name* from the run's
          # artifact list first, so a transient download failure is never
          # mistaken for "the signed artifact is absent".
          artifact_names="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[].name')"
          pick_artifact() {
            local name
            for name in "$@"; do
              if printf '%s\n' "$artifact_names" | grep -qxF "$name"; then
                printf '%s\n' "$name"
                return 0
              fi
            done
            echo "::error::none of the expected artifacts exists in run $RUN_ID: $*" >&2
            return 1
          }
          windows_artifact="$(pick_artifact yacr-windows-release yacr-windows-release-unsigned)"
          android_artifact="$(pick_artifact android-release android-release-unsigned)"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n "$windows_artifact" -D artifacts/windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n "$android_artifact" -D artifacts/android
          find artifacts -type f -printf '%s\t%p\n' | sort -k2
      - name: Flatten and verify the SHA-256 sidecars
        run: |
          set -euo pipefail
          # Never stage into the repository's own tracked `assets/` (icons): it is
          # checked out by actions/checkout and would end up in the asset glob.
          rm -rf release-assets && mkdir -p release-assets
          find artifacts -type f -exec cp -t release-assets {} +
          shopt -s nullglob
          for sum in release-assets/*.sha256; do
            ( cd release-assets && sha256sum -c "$(basename "$sum")" )
          done
          ls -l release-assets
      - name: Publish the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES_FILE: ${{ inputs.notes_file }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Explicit deliverable allowlist: only regular release files, never a
          # directory and never a repository file that happened to be checked out.
          # Signed and unsigned-fallback names are both listed; only one of each
          # pair is uploaded by a given build run.
          shopt -s nullglob
          files=(
            release-assets/*.flatpak release-assets/*.flatpak.sha256
            release-assets/*.flatpak.gpg
            release-assets/*.zip release-assets/*.zip.sha256
            release-assets/*.tar.gz release-assets/*.tar.gz.sha256
            release-assets/app-universal-release.apk
            release-assets/*.apk.sha256
            release-assets/SIGNING.txt
            release-assets/app-universal-release-unsigned.apk
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets matched under release-assets/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            printf '%s\t%s\n' "$(stat -c %s "$f")" "$f"
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            edit_args=(--title "yacr $TAG")
            if [ -n "$NOTES_FILE" ]; then
              edit_args+=(--notes-file "$NOTES_FILE")
            fi
            if [ "$PRERELEASE" = "true" ]; then
              edit_args+=(--prerelease)
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${edit_args[@]}"
          else
            args=(--title "yacr $TAG" --verify-tag)
            if [ -n "$NOTES_FILE" ]; then
              args+=(--notes-file "$NOTES_FILE")
            else
              args+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,isPrerelease,assets \
            --jq '{url,isDraft,isPrerelease,assets:[.assets[]|{name,size}]}'
